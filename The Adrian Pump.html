<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root {
  --bg: #0e0f11;
  --surface: #16181c;
  --surface2: #1e2127;
  --border: #2a2e36;
  --text: #eef0f3;
  --muted: #8b919c;
  --accent: #c6ff3d;
  --accent-strong: #c6ff3d;
  --accent-ink: #0e0f11;
  --blue: #5ab0ff;
  --orange: #ff9f43;
  --danger: #ff5d5d;
  --ok: #3ddc97;
  --warn: #ffc547;
  --radius: 14px;
  --shadow: 0 20px 60px rgba(0,0,0,.5);
  /* anatomical muscle map */
  --atlas-bg: #14161a;
  --atlas-skin: #2b2e34;
  --atlas-line: #5f6570;
  --atlas-glow: #252830;
  --mm3-core: #3a3e46;
  --mm-off: #4a4e57;
  --mm-0: #5f646e;
  --mm-1: #e9a593;
  --mm-2: #d65f48;
  --mm-3: #a3241b;
  --mm-fiber: rgba(0,0,0,.34);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface2: #f1f3f6;
  --border: #e1e4ea;
  --text: #121418;
  --muted: #5f6672;
  --accent: #b5f23a;
  --accent-strong: #4d7c0f;
  --accent-ink: #121418;
  --blue: #2f80d1;
  --orange: #e07b12;
  --danger: #d93a3a;
  --ok: #16995b;
  --warn: #b7791f;
  --shadow: 0 20px 60px rgba(20,24,32,.18);
  --atlas-bg: #f6f3ee;
  --atlas-skin: #ece5db;
  --atlas-line: #8d8274;
  --atlas-glow: #ffffff;
  --mm3-core: #efe9e0;
  --mm-off: #e3dcd1;
  --mm-0: #d4ccbf;
  --mm-1: #f2b6a4;
  --mm-2: #dd6a52;
  --mm-3: #a8261d;
  --mm-fiber: rgba(70,35,20,.22);
  color-scheme: light;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-family: Oswald, Inter, sans-serif; font-weight: 600; letter-spacing: .3px; }
h1 { font-size: 30px; text-transform: uppercase; line-height: 1.1; }
h2 { font-size: 24px; text-transform: uppercase; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
h4 { font-size: 16px; font-weight: 600; }
a { color: var(--accent-strong); }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.hidden { display: none !important; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 16px; }
.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent-strong); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.xl { width: 40px; height: 40px; color: var(--muted); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent-strong); width: 18px; height: 18px; cursor: pointer; margin: 0; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;
}
.brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 22px; text-decoration: none; color: var(--text); }
.brand-name { font-family: Oswald, sans-serif; font-size: 19px; font-weight: 600; text-transform: uppercase; line-height: 1.02; letter-spacing: .5px; }
.brand-name span { color: var(--accent-strong); font-size: 24px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-weight: 500;
}
.nav a:hover { color: var(--text); background: var(--surface2); }
.nav a.active { background: var(--surface2); color: var(--text); }
.nav a.active svg { color: var(--accent-strong); }
.sidebar-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 4px; }
.sidebar-foot small { color: var(--muted); font-size: 11px; padding: 0 8px; }
/* cloud sync status */
.sync-pill { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; text-align: left; }
.sync-pill:hover { color: var(--text); border-color: var(--muted); }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
[data-state="synced"] .sync-dot { background: var(--ok); }
[data-state="saving"] .sync-dot, [data-state="connecting"] .sync-dot { background: var(--warn); animation: syncPulse 1s ease-in-out infinite; }
[data-state="error"] .sync-dot, [data-state="unavailable"] .sync-dot { background: var(--danger); }
[data-state="link"] .sync-dot { background: var(--blue); }
@keyframes syncPulse { 50% { opacity: .35; } }
.sync-btn-m { position: relative; }
.sync-btn-m .sync-dot { width: 10px; height: 10px; }
.sync-err { color: var(--danger); font-size: 13px; min-height: 18px; }
.sync-info { display: grid; gap: 6px; font-size: 13px; }
.sync-info b { font-weight: 600; }
main { padding: 28px 32px 80px; width: 100%; max-width: 1240px; min-width: 0; }
.mobile-top, .bottom-nav { display: none; }

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .sub { color: var(--muted); margin: 4px 0 0; }

/* ============================================================
   COMPONENTS
   ============================================================ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.span-2 { grid-column: 1 / -1; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 16px 18px; }
.kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
.kpi .value { font-family: Oswald, sans-serif; font-size: 30px; font-weight: 600; line-height: 1.15; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .value small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.kpi.accent .label, .kpi.accent .hint, .kpi.accent .value small { color: inherit; opacity: .72; }
.chart-box { position: relative; height: 270px; }
.chart-box.tall { height: 320px; }

.input {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 0 12px; height: 40px; font: inherit; width: 100%;
  outline: none; transition: border-color .15s, background .15s;
  text-transform: none; letter-spacing: normal;
}
.input:focus { border-color: var(--accent-strong); }
.input::placeholder { color: var(--muted); opacity: .7; }
textarea.input { height: auto; padding: 10px 12px; resize: vertical; min-height: 40px; line-height: 1.5; }
select.input { width: auto; padding-right: 12px; cursor: pointer; }
.input.sm { height: 34px; font-size: 13px; width: auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: border-color .15s, filter .15s, background .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg.i { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover { filter: brightness(1.06); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn-danger:hover { border-color: var(--danger); }
.btn-danger-solid { background: var(--danger); color: #fff; border-color: transparent; }
.btn-sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn-dashed { width: 100%; border-style: dashed; background: transparent; color: var(--muted); }
.btn-dashed:hover { color: var(--text); }
.w100 { width: 100%; }
.icon-btn {
  width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; border: 0;
  background: transparent; color: var(--muted); cursor: pointer; padding: 0; flex: none;
}
.icon-btn:hover { background: var(--surface2); color: var(--text); }
.icon-btn.danger:hover { color: var(--danger); }
.icon-btn svg.i { width: 16px; height: 16px; }

.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.chip.active, .chip:hover { border-color: var(--accent-strong); color: var(--text); }
.delta { font-weight: 700; white-space: nowrap; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--danger); }

.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
.form { display: grid; gap: 14px; }
.form select.input { width: 100%; }
.form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.form-grid.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .span-2 { grid-column: span 2; }
.form-grid .span-4 { grid-column: 1 / -1; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg-btn { font: inherit; font-weight: 600; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 9px; cursor: pointer; }
.seg-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.2); }

.bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; flex: 1; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data td { padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td, table.data tr.sel td { background: var(--surface2); }
table.data td.wrap { white-space: normal; min-width: 140px; }
.num-cell { font-variant-numeric: tabular-nums; }

.empty-state { text-align: center; padding: 40px 20px; display: grid; justify-items: center; gap: 10px; }
.list-empty { color: var(--muted); padding: 16px 0; text-align: center; font-size: 13px; }
.hint-line { color: var(--muted); font-size: 12px; text-align: center; margin: 16px 0; }

/* ============================================================
   DASHBOARD
   ============================================================ */
.pr-list { display: grid; gap: 2px; }
.pr-item { display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.pr-item:last-child { border-bottom: 0; }
.pr-item .trophy { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--warn) 16%, transparent); flex: none; }
.pr-item .info { flex: 1; min-width: 0; }
.pr-item .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-item .info span { font-size: 12px; color: var(--muted); }
.pr-item .val { font-family: Oswald, sans-serif; font-size: 18px; white-space: nowrap; }

/* ============================================================
   MUSCLE MAP
   ============================================================ */
.mm-card { margin-bottom: 16px; position: relative; container-type: inline-size; }
.mm-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.mm-layout:has(.mm3d) { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@container (max-width: 780px) { .mm-layout, .mm-layout:has(.mm3d) { grid-template-columns: 1fr; } }
.mm-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--atlas-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px 10px; }
.mm-fig { margin: 0; min-width: 0; }
.mm-fig svg { display: block; width: 100%; height: auto; max-height: 560px; }
.mm-fig figcaption { text-align: center; font-family: Oswald, sans-serif; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.mm-skin { fill: var(--atlas-skin); stroke: var(--atlas-line); stroke-width: .8; }
.mm-line { fill: none; stroke: var(--atlas-line); stroke-width: .6; opacity: .85; }
.mm-off { fill: var(--mm-off); stroke: var(--atlas-line); stroke-width: .6; }
.mm-lbl { font: 600 9px Inter, sans-serif; fill: var(--muted); letter-spacing: 1px; }.mm-g { cursor: pointer; outline: none; }
.m-fill { fill: var(--mm-0); stroke: var(--atlas-line); stroke-width: .7; transition: fill .35s, stroke .15s; }
.mm-g[data-level="0"] .m-fill { stroke-dasharray: 2 1.4; }
.mm-g[data-level="1"] .m-fill { fill: var(--mm-1); }
.mm-g[data-level="2"] .m-fill { fill: var(--mm-2); }
.mm-g[data-level="3"] .m-fill { fill: var(--mm-3); }
.m-fib, .m-det { pointer-events: none; }
.m-det { fill: none; stroke: var(--mm-fiber); stroke-width: .8; }
.mm-g.hov .m-fill, .mm-g:focus-visible .m-fill { stroke: var(--text); stroke-width: 1.3; stroke-dasharray: none; }
.mm-g.sel .m-fill { stroke: var(--text); stroke-width: 1.9; stroke-dasharray: none; }
.mm-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); font-size: 12px; display: grid; gap: 2px; max-width: 240px; }
.mm-tip b { font-size: 13px; }
.mm-tip span { color: var(--muted); }
.mm-detail { min-width: 0; }
.mm-name { text-transform: none; font-size: 26px; margin-top: 2px; }
.mm-latin { font-style: italic; margin-bottom: 12px; }
.mm-level { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface2); border-radius: 10px; font-size: 13px; }
.mm-sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--atlas-line); background: var(--mm-0); flex: none; display: inline-block; }
.mm-sw[data-level="1"], .mm-bar i[data-level="1"] { background: var(--mm-1); }
.mm-sw[data-level="2"], .mm-bar i[data-level="2"] { background: var(--mm-2); }
.mm-sw[data-level="3"], .mm-bar i[data-level="3"] { background: var(--mm-3); }
.mm-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.mm-stats div { background: var(--surface2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.mm-stats b { display: block; font-family: Oswald, sans-serif; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-stats b small { display: block; font-family: Inter, sans-serif; font-size: 11px; color: var(--muted); font-weight: 500; line-height: 1.2; }
.mm-stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.mm-ex { display: grid; margin-top: 6px; }
.mm-ex div { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.mm-ex div:last-child { border-bottom: 0; }
.mm-ex div span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mm-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 14px; font-size: 12px; }
.mm-legend > div { display: flex; align-items: center; gap: 6px; }
.mm-note { font-size: 11px; color: var(--muted); margin: 8px 0 0; }
.mm-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 18px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.mm-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) 64px 34px; gap: 8px; align-items: center; font: inherit; font-size: 13px; color: var(--text); background: none; border: 0; border-radius: 8px; padding: 6px; cursor: pointer; text-align: left; }
.mm-row:hover, .mm-row.sel { background: var(--surface2); }
.mm-row .mm-rv { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.mm-bar { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.mm-row:hover .mm-bar, .mm-row.sel .mm-bar { background: var(--border); }
.mm-bar i { display: block; height: 100%; border-radius: 99px; background: var(--mm-0); }
.ex-targets { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.mchip small { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.mchip.p { background: var(--mm-2); border-color: transparent; color: #fff; }
.mchip.s { background: color-mix(in srgb, var(--mm-1) 35%, transparent); border-color: var(--mm-1); color: var(--text); }
.mm3d { position: relative; height: 580px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: radial-gradient(ellipse at 50% 38%, var(--atlas-glow) 0%, var(--atlas-bg) 72%); }
.mm3d-stage { position: absolute; inset: 0; }
.mm3d-stage canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; outline: none; }
.mm3d-stage canvas.pick { cursor: pointer; }
.mm3d-stage canvas.dragging { cursor: grabbing; }
.mm3d-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.mm3d-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; z-index: 2; }
.mm3d-tools.br { top: auto; left: auto; right: 10px; bottom: 10px; align-items: center; justify-content: flex-end; }
.mm3d-tools .icon-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 17px; font-weight: 700; }
.mm3d-tools .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.mm3d-orient { position: absolute; top: 16px; right: 14px; font-family: Oswald, sans-serif; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); z-index: 2; pointer-events: none; }
.mm3d-hint { font-size: 11px; color: var(--muted); margin: 6px 2px 0; }
.mm3d-label { position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--text); color: var(--bg); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.mm3d-label::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 2px; height: 10px; background: var(--text); transform: translateX(-50%); }
@container (max-width: 520px) { .mm3d-orient { top: auto; right: auto; left: 14px; bottom: 54px; } }
@media (max-width: 768px) { .mm3d { height: 470px; } }

/* ============================================================
   TRAINING
   ============================================================ */
.week-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: thin; }
.wtab {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 16px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font: inherit;
}
.wtab b { font-family: Oswald, sans-serif; font-size: 15px; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.wtab small { color: var(--muted); font-size: 11px; }
.wtab.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.wtab.active small { color: inherit; opacity: .7; }
.wtab.add { justify-content: center; color: var(--muted); border-style: dashed; background: transparent; font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.wtab.active .dot { background: var(--accent-ink); }

.week-head { margin-bottom: 16px; }
.wh-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.wk-progress { display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 12px; }
.wk-nums { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.wk-nums div { background: var(--surface2); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.wk-nums b { display: block; font-family: Oswald, sans-serif; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-nums span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 180px; }
.search svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; pointer-events: none; }
.search .input { padding-left: 36px; }

.day { padding: 0; margin-bottom: 16px; overflow: hidden; }
.day.is-done { border-color: color-mix(in srgb, var(--accent-strong) 55%, var(--border)); }
.day-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; flex-wrap: wrap; }
.day-name {
  font-family: Oswald, sans-serif; font-size: 19px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
  background: transparent; border: 1px solid transparent; color: var(--text); min-width: 100px; flex: 1; height: 38px; padding: 0 8px; border-radius: 8px; outline: none;
}
.day-name:hover { border-color: var(--border); }
.day-name:focus { background: var(--surface2); border-color: var(--accent-strong); }
.chev { transition: transform .2s; }
.day.collapsed .chev { transform: rotate(-90deg); }
.day.collapsed .day-body, .day.collapsed .day-meta { display: none; }
.done-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); user-select: none; }
.day.is-done .done-toggle { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.day.is-done .done-toggle input { accent-color: var(--accent-ink); }
.day-actions { display: flex; gap: 2px; }
.day-meta { display: flex; gap: 8px; flex-basis: 100%; padding-left: 40px; flex-wrap: wrap; }
.day-meta .focus-in { flex: 1; min-width: 160px; }
.day-stats { padding: 7px 16px; font-size: 12px; color: var(--muted); background: var(--surface2); border-top: 1px solid var(--border); }
.day-body { padding: 14px; display: grid; gap: 12px; border-top: 1px solid var(--border); }

.ex { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 14px; background: var(--bg); min-width: 0; }
.ex.dragging { opacity: .4; }
.ex.drop-before { box-shadow: 0 -3px 0 var(--accent-strong); }
.ex.drop-after { box-shadow: 0 3px 0 var(--accent-strong); }
.ex-head { display: flex; align-items: flex-start; gap: 6px; }
.drag { cursor: grab; color: var(--muted); padding: 6px 2px; display: grid; place-items: center; }
.ex-title { flex: 1; min-width: 0; padding-top: 3px; }
.ex-title h4 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.ex-num { font-family: Oswald, sans-serif; color: var(--muted); font-size: 14px; }
.ex-actions { display: flex; gap: 0; flex-wrap: wrap; justify-content: flex-end; }
.pr-flag { font-family: Inter, sans-serif; font-size: 11px; font-weight: 700; color: var(--warn); }
.instr summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; margin: 8px 0 4px; }
.instr div { font-size: 13px; color: var(--muted); white-space: pre-wrap; background: var(--surface2); padding: 10px 12px; border-radius: 8px; }
.ex-prev { font-size: 12px; color: var(--muted); margin: 8px 0 4px; display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
.ex-prev b { color: var(--text); }
.pr-mini { color: var(--warn); font-weight: 600; }
table.sets { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 6px; }
table.sets .c-set { width: 46px; }
table.sets .c-reps { width: 21%; }
table.sets .c-kg { width: 23%; }
table.sets .c-btn { width: 34px; }
table.sets th { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); text-align: left; padding: 4px 3px; font-weight: 600; }
table.sets td { padding: 3px; }
table.sets .input { height: 38px; padding: 0 8px; }
table.sets .input.num { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
table.sets tr.done .input.num { border-color: color-mix(in srgb, var(--accent-strong) 50%, var(--border)); }
table.sets .c { text-align: center; }
table.sets.cardio .c-km { width: 15%; }
table.sets.cardio .c-time { width: 17%; }
table.sets.cardio .c-steps { width: 17%; }
table.sets .input.invalid { border-color: var(--red, #e5484d); }
.cardio-ic { margin-right: 6px; }
.tag-cardio { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 45%, var(--border)); }
.cardio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; margin-top: 10px; }
.cardio-pick { justify-content: flex-start; }
.cardio-pick .cardio-ic { font-size: 22px; }
.kg-toggle { font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); background: none; border: 0; border-bottom: 1px dashed var(--border); padding: 0 0 1px; cursor: pointer; }
.kg-toggle:hover { color: var(--text); border-color: var(--muted); }
.kg-toggle.on { color: var(--accent-strong); border-color: var(--accent-strong); }
.setno { font-weight: 700; color: var(--muted); font-size: 13px; text-align: center; white-space: nowrap; }
.pr-cell { font-size: 11px; margin-left: 2px; }
.ex-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.ex-stats { font-size: 12px; color: var(--muted); }
.ex-stats b { color: var(--text); }
.ex-notes { margin-top: 10px; font-size: 13px; min-height: 38px; resize: none; overflow: hidden; }
.ex-imgs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.ex-thumb { width: 72px; height: 72px; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface2); cursor: zoom-in; }
.ex-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ex-thumb:hover, .ex-thumb:focus-visible { border-color: var(--accent-strong); }
.ex-img-add { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.ex-imgs .ex-thumb ~ .ex-img-add { height: 72px; flex-direction: column; justify-content: center; width: 72px; padding: 0; }
.ex-img-add:hover { color: var(--text); border-color: var(--accent-strong); }
.ex-img-add .i { width: 16px; height: 16px; }
.ex-img-hint { font-size: 11px; color: var(--muted); }
.ex.img-drop { outline: 2px dashed var(--accent-strong); outline-offset: 2px; }
.img-nav { align-items: flex-end; gap: 8px; flex-wrap: nowrap; }
.img-nav .field { flex: 1; margin: 0; }
.img-nav .btn { height: 38px; }

/* Modal pickers */
.pick-list { display: grid; gap: 6px; margin-top: 10px; max-height: 360px; overflow: auto; }
.pick {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; width: 100%;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font: inherit; cursor: pointer;
}
.pick:hover { border-color: var(--accent-strong); }
.pick .sub { font-size: 12px; color: var(--muted); }
.radios { display: grid; gap: 8px; }
.radio { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
.radio:has(input:checked) { border-color: var(--accent-strong); background: var(--surface2); }
.radio input { margin-top: 2px; }
.radio b { display: block; }
.radio span { font-size: 12px; color: var(--muted); }

/* ============================================================
   BODY / PHOTOS
   ============================================================ */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
.photo { margin: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: var(--surface2); }
.photo.sel { border-color: var(--accent-strong); }
.photo img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; cursor: zoom-in; }
.photo figcaption { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.photo figcaption span { flex: 1; }
.storage { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.storage .bar { max-width: 260px; }
.lightbox img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 10px; background: #000; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare figure { margin: 0; }
.compare img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; }
.compare figcaption { text-align: center; font-size: 13px; margin-top: 6px; }

/* ============================================================
   KNOWLEDGE
   ============================================================ */
.kn { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.kn-list { display: grid; gap: 10px; position: sticky; top: 16px; }
.kn-list select.input { width: 100%; }
.note-item { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.note-item:hover { background: var(--surface2); }
.note-item.active { background: var(--surface2); border-color: var(--border); }
.note-item b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item .meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.note-items { display: grid; gap: 2px; max-height: 60vh; overflow: auto; }
.kn-detail { min-height: 300px; }
.note-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 18px; font-size: 12px; color: var(--muted); }
.md { line-height: 1.7; font-size: 15px; }
.md h2, .md h3, .md h4, .md h5 { font-family: Oswald, sans-serif; margin: 20px 0 8px; text-transform: none; letter-spacing: .2px; }
.md h2 { font-size: 22px; } .md h3 { font-size: 18px; } .md h4, .md h5 { font-size: 16px; }
.md p { margin: 0 0 12px; }
.md ul, .md ol { padding-left: 22px; margin: 0 0 12px; }
.md blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent-strong); background: var(--surface2); border-radius: 0 8px 8px 0; color: var(--muted); }
.md code { background: var(--surface2); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
.md pre { background: var(--surface2); padding: 12px; border-radius: 10px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
.links { display: grid; gap: 8px; margin-top: 18px; }
.link-card { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--text); background: var(--surface2); min-width: 0; }
.link-card:hover { border-color: var(--accent-strong); }
.link-card img { width: 112px; height: 63px; object-fit: cover; border-radius: 6px; flex: none; background: #000; }
.link-card span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.lib-card { display: flex; flex-direction: column; gap: 8px; }
.lib-card p { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
.lib-card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 12px; color: var(--muted); }

/* ============================================================
   MODAL & TOAST
   ============================================================ */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; z-index: 50; animation: fade .15s ease-out; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: var(--shadow); }
.modal.wide { max-width: 780px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 16px; }
.modal-body { padding: 18px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; }
@keyframes fade { from { opacity: 0; } }
#toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 60; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 12px; background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow); animation: fade .2s; transition: opacity .3s, transform .3s; }
.toast.error { background: var(--danger); color: #fff; }
.toast.pr { background: var(--accent); color: var(--accent-ink); }
.toast.out { opacity: 0; transform: translateY(8px); }
.toast button { font: inherit; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 3px 10px; cursor: pointer; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kn { grid-template-columns: 1fr; }
  .kn-list { position: static; }
  .note-items { max-height: 280px; }
  .mm-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .mm-layout { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wk-nums { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  .app { display: block; }
  .sidebar { display: none; }
  main { padding: 16px 16px 100px; }
  .mobile-top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .mobile-top .brand { padding: 0; gap: 10px; }
  .mobile-top .brand svg { width: 32px; height: 32px; }
  .mobile-top .brand-name { font-size: 15px; }
  .mobile-top .brand-name span { font-size: 15px; }
  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 600; border-radius: 10px; }
  .bottom-nav a.active { color: var(--accent-strong); }
  h1 { font-size: 24px; }
  .page-head { align-items: stretch; }
  .page-head > .row { width: 100%; }
  .page-head > .row select.input { flex: 1; min-width: 0; }
  .page-head > select.input { width: 100%; }
  .kpi { padding: 14px; }
  .kpi .value { font-size: 24px; }
  .card { padding: 14px; }
  .day-meta { padding-left: 0; }
  .day-head { padding: 10px; }
  .day-body { padding: 10px; }
  .ex { padding: 10px; }
  .chart-box { height: 230px; }
  .wk-nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wk-nums div:last-child { grid-column: 1 / -1; }
  .compare { grid-template-columns: 1fr 1fr; gap: 8px; }
  #toasts { left: 16px; right: 16px; bottom: 84px; }
}
@media (max-width: 480px) {
  .mm-list { grid-template-columns: 1fr; }
  .mm-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mm-figs { padding: 10px 2px 6px; }

const EXIMG_KEY = 'adrianPump.exImages';

  list: [], db: null, mode: 'idb', ready: false,

    if (old) this.list[i] = rec; else this.list.push(rec);
    try { this.writeLS(); } catch (e) { if (old) this.list[i] = old; else this.list.pop(); throw e; }

  inflight: {}, tooBig: {}, cloudSnapshot: null, pendingRender: false, lastSync: null, lastError: '',
  meta: { uid: null, linked: false, base: {}, lt: {} },
  dev: (() => { try { let d = localStorage.getItem('adrianPump.device'); if (!d) { d = uid(); localStorage.setItem('adrianPump.device', d); } return d; } catch (e) { return uid(); } })(),

  /* ---------- bookkeeping ---------- */
  loadMeta(id) {
    let m = null;
    try { m = JSON.parse(localStorage.getItem(SYNC_META_KEY) || 'null'); } catch (e) {}
    this.meta = m && m.uid === id ? { linked: false, base: {}, lt: {}, ...m } : { uid: id, linked: false, base: {}, lt: {} };
  },
  saveMeta() { try { localStorage.setItem(SYNC_META_KEY, JSON.stringify(this.meta)); } catch (e) {} },

  // The app state as documents: key -> { h: hash, s(): JSON string }.
  parts() {
    const out = {};
    const put = (k, v) => { const s = JSON.stringify(v); out[k] = { h: strHash(s), s: () => s }; };
    const settings = { ...S.settings };
    SYNC_LOCAL_SETTINGS.forEach(k => delete settings[k]);
    put('settings', settings);
    ['library', 'body', 'notes'].forEach(k => put(k, S[k]));
    const misc = {};
    Object.keys(S).forEach(k => { if (!['settings', 'library', 'body', 'notes', 'seasons'].includes(k)) misc[k] = S[k]; });
    put('misc', misc);
    put('seasons', S.seasons.map(s => { const { weeks, ...m } = s; return { ...m, weekIds: weeks.map(w => w.id) }; }));
    S.seasons.forEach(s => s.weeks.forEach(w => put('week_' + w.id, { seasonId: s.id, week: w })));
    PHOTOS.forEach(p => { out['photo_' + p.id] = { h: mediaFp(p), s: () => JSON.stringify(p) }; });
    ExImg.list.forEach(x => { out['img_' + x.id] = { h: mediaFp(x), s: () => JSON.stringify(x) }; });
    return out;
  },
  cloudHash(k, j) {
    if (!isMediaKey(k)) return strHash(j);
    try { return mediaFp(JSON.parse(j)); } catch (e) { return strHash(j); }
  },
  // Rebuild S from parsed documents, keeping this device's view settings.
  assemble(cur) {
    const local = {};
    SYNC_LOCAL_SETTINGS.forEach(k => { if (S && S.settings && k in S.settings) local[k] = S.settings[k]; });
    const d = { ...(cur.misc || {}), settings: { ...(cur.settings || {}), ...local }, library: cur.library || [], body: cur.body || [], notes: cur.notes || [] };
    const weeks = Object.keys(cur).filter(k => k.startsWith('week_')).map(k => cur[k]);
    d.seasons = (cur.seasons || []).map(m => {
      const { weekIds = [], ...s } = m;
      const order = new Map(weekIds.map((id, i) => [id, i]));
      const pos = w => order.has(w.id) ? order.get(w.id) : 1e9;
      return { ...s, weeks: weeks.filter(w => w.seasonId === s.id).map(w => w.week).sort((a, b) => pos(a) - pos(b)) };
    });
    return migrate(d);
  },

  /* ---------- applying cloud changes ---------- */
  async applyRemote(changes) {
    if (!changes.length) return;
    this.applying = true;
    try {
      const core = changes.filter(c => !isMediaKey(c.k));
      if (core.length) {
        const P = this.parts(), cur = {};
        Object.keys(P).forEach(k => { if (!isMediaKey(k)) cur[k] = JSON.parse(P[k].s()); });
        core.forEach(c => { if (c.j == null) delete cur[c.k]; else cur[c.k] = JSON.parse(c.j); });
        S = this.assemble(cur);
        REV++;
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      }
      const photos = changes.filter(c => c.k.startsWith('photo_'));
      photos.forEach(c => {
        const id = c.k.slice(6), i = PHOTOS.findIndex(p => p.id === id);
        if (c.j == null) { if (i >= 0) PHOTOS.splice(i, 1); }
        else { const p = JSON.parse(c.j); if (i >= 0) PHOTOS[i] = p; else PHOTOS.push(p); }
      });
      if (photos.length) { try { localStorage.setItem(PKEY, JSON.stringify(PHOTOS)); } catch (e) { /* the cloud still has them */ } }
      for (const c of changes.filter(c => c.k.startsWith('img_'))) {
        try { if (c.j == null) await ExImg.remove([c.k.slice(4)]); else await ExImg.put(JSON.parse(c.j)); }
        catch (e) { console.warn('Could not store a synced exercise image', e); }
      }
    } finally { this.applying = false; }
    const P = this.parts();
    changes.forEach(c => {
      if (c.j == null) delete this.meta.base[c.k];
      else this.meta.base[c.k] = { l: P[c.k] ? P[c.k].h : '', c: this.cloudHash(c.k, c.j) };
      this.meta.lt[c.k] = c.t || 0;
    });
    this.saveMeta();
    this.rerender();
  },
  // Re-render for remote changes, but never while the user is typing or has a dialog open.
  rerender() {
    const a = document.activeElement;
    const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#view');
    if (typing || Modal.isOpen()) { this.pendingRender = true; return; }
    this.pendingRender = false;
    render();
  },

  /* ---------- pushing local changes ---------- */
  queue() {
    if (!this.merged || this.applying) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 500);
  },
  push() {
    clearTimeout(this.timer);
    if (!this.merged || !this.user || this.applying) return;
    const P = this.parts(), B = this.meta.base, now = Date.now();
    const sets = Object.keys(P).filter(k => (!B[k] || B[k].l !== P[k].h) && this.inflight[k] !== P[k].h);
    const dels = Object.keys(B).filter(k => !P[k] && this.inflight[k] !== 'del');
    if (!sets.length && !dels.length) return;
    const { doc, setDoc, deleteDoc } = this.fs;
    const ref = k => doc(this.db, 'users', this.user.uid, 'parts', k);
    const run = (k, tag, promise, done) => {
      this.inflight[k] = tag; this.pending++;
      this.setState(navigator.onLine === false ? 'offline' : 'saving');
      promise.then(done).catch(e => this.fail(e)).finally(() => { if (this.inflight[k] === tag) delete this.inflight[k]; this.pending--; this.settle(); });
    };
    sets.forEach(k => {
      const h = P[k].h, j = P[k].s();
      if (j.length > SYNC_MAX_DOC) {
        if (!this.tooBig[k]) { this.tooBig[k] = 1; toast('One image is too large to sync (over 1 MB) — it stays on this device only.', 'error'); }
        return;
      }
      this.meta.lt[k] = now;
      run(k, h, setDoc(ref(k), { j, t: now, dev: this.dev }), () => { this.meta.base[k] = { l: h, c: this.cloudHash(k, j) }; this.saveMeta(); });
    });
    dels.forEach(k => {
      this.meta.lt[k] = now;
      run(k, 'del', deleteDoc(ref(k)), () => { delete this.meta.base[k]; this.saveMeta(); });
    });
    this.saveMeta();
  },
  settle() {
    if (this.pending > 0 || !this.user || !this.merged) return;
    this.lastSync = new Date();
    if (this.state !== 'error') this.setState(navigator.onLine === false ? 'offline' : 'synced');
  },
  fail(e) {
    console.warn('Cloud sync error:', e);
    this.lastError = e && e.code === 'permission-denied' ? 'The cloud refused the request (permission-denied). Check the Firestore rules.' : String((e && (e.code || e.message)) || e);
    this.setState('error');
  },

  /* ---------- connecting ---------- */
  async start() {
    if (this.fs) return;
    this.setState('connecting');
    try {
      const [appMod, authMod, fsMod] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(FIREBASE_SDK + f)));
      this.fs = fsMod; this.authApi = authMod;
      const app = appMod.initializeApp(FIREBASE_CONFIG);
      this.auth = authMod.initializeAuth(app, { persistence: [authMod.indexedDBLocalPersistence, authMod.browserLocalPersistence, authMod.inMemoryPersistence] });
      this.db = fsMod.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
      authMod.onAuthStateChanged(this.auth, u => this.onUser(u));
    } catch (e) {
      console.warn('Cloud sync unavailable:', e);
      this.fs = null;
      this.setState('unavailable');
    }
  },
  onUser(u) {
    if (this.unsub) { this.unsub(); this.unsub = null; }
    this.user = u || null; this.merged = false; this.cloudSnapshot = null; this.lastError = '';
    if (!u) { this.setState('off'); return; }
    this.loadMeta(u.uid);
    this.setState('connecting');
    const col = this.fs.collection(this.db, 'users', u.uid, 'parts');
    this.unsub = this.fs.onSnapshot(col, snap => this.onSnap(snap), e => this.fail(e));
  },
  onSnap(snap) {
    if (!this.merged) {
      if (snap.metadata.fromCache) return; // wait for the server's answer
      const cloud = {};
      snap.forEach(d => { const v = d.data(); cloud[d.id] = { j: v.j, t: v.t || 0 }; });
      this.cloudSnapshot = cloud;
      if (!this.meta.linked) { this.setState('link'); this.linkDialog(); }
      else if (!this.merging) { this.merging = true; this.firstMerge(cloud).finally(() => { this.merging = false; }); }
      return;
    }
    const changes = [];
    snap.docChanges().forEach(ch => {
      const d = ch.doc;
      if (d.metadata.hasPendingWrites) return; // our own write echoing back
      const k = d.id, b = this.meta.base[k];
      if (ch.type === 'removed') { if (b) changes.push({ k, j: null, t: Date.now() }); return; }
      const v = d.data();
      if (b && b.c === this.cloudHash(k, v.j)) return; // already have this version
      changes.push({ k, j: v.j, t: v.t || 0 });
    });
    if (!changes.length) return;
    const P = this.parts();
    // keep a local edit that is newer than the incoming one; push() sends it afterwards
    const take = changes.filter(c => {
      const b = this.meta.base[c.k], L = P[c.k];
      const editedHere = L ? (!b || b.l !== L.h) : !!b;
      return !editedHere || (c.t || 0) >= (this.meta.lt[c.k] || 0);
    });
    this.applyRemote(take).then(() => { this.queue(); this.settle(); });
  },
  // Reconcile after this device was offline or closed: per document, whichever side changed wins.
  async firstMerge(cloud) {
    const P = this.parts(), B = this.meta.base, lt = this.meta.lt;
    const take = [];
    new Set([...Object.keys(P), ...Object.keys(cloud), ...Object.keys(B)]).forEach(k => {
      const L = P[k], C = cloud[k], b = B[k], cH = C ? this.cloudHash(k, C.j) : null;
      if (L && C) {
        if (L.h === cH) { B[k] = { l: L.h, c: cH }; return; }
        const editedHere = !b || b.l !== L.h, editedThere = !b || b.c !== cH;
        if (!editedHere && editedThere) take.push({ k, j: C.j, t: C.t });
        else if (editedHere && editedThere && (C.t || 0) > (lt[k] || 0)) take.push({ k, j: C.j, t: C.t });
      } else if (C) {
        if (!b || (b.c !== cH && (C.t || 0) > (lt[k] || 0))) take.push({ k, j: C.j, t: C.t }); // else: deleted here, push() deletes it
      } else if (L) {
        if (b && b.l === L.h) take.push({ k, j: null, t: Date.now() }); // deleted on another device
      } else delete B[k];
    });
    await this.applyRemote(take);
    this.merged = true;
    this.push();
    this.settle();
  },

  /* ---------- first sign-in on a device ---------- */
  linkDialog() {
    if (this.linking || !this.cloudSnapshot) return;
    this.linking = true;
    const cloud = this.cloudSnapshot, count = p => Object.keys(cloud).filter(k => k.startsWith(p)).length;
    const localWeeks = S.seasons.reduce((a, s) => a + s.weeks.length, 0);
    const here = `${localWeeks} weeks · ${S.body.length} body entries · ${PHOTOS.length} photos · ${ExImg.list.length} exercise images`;
    const done = () => { this.linking = false; };
    if (!Object.keys(cloud).length) {
      Modal.open({
        title: 'Set up cloud sync', onClose: done,
        body: `<p>Your cloud is empty. Upload this device's data so your other devices can use it?</p><p class="muted small">This device: ${here}.</p>`,
        actions: [{ label: 'Not now', onClick: done }, { label: 'Upload to cloud', cls: 'btn-primary', onClick: () => { done(); this.useLocal(); } }],
      });
    } else {
      Modal.open({
        title: 'Cloud data found', onClose: done,
        body: `<p>Your cloud already has data: <b>${count('week_')} weeks</b>, ${count('photo_')} photos, ${count('img_')} exercise images.</p>
          <p>This device has ${here}.</p>
          <p class="muted small">Pick the copy to keep; the other is replaced. Using the cloud data is right for a new phone or browser. A backup of this device's workouts is kept in the browser either way.</p>`,
        actions: [
          { label: 'Replace cloud with this device', cls: 'btn-danger left', onClick: () => { done(); this.confirmReplaceCloud(); } },
          { label: 'Use cloud data here', cls: 'btn-primary', onClick: () => { done(); this.useCloud(); } },
        ],
      });
    }
  },
  async confirmReplaceCloud() {
    if (await confirmDialog('This overwrites the data in your cloud — and so on every other device — with this device\'s data.', { title: 'Replace cloud data?', ok: 'Replace cloud' })) this.useLocal();
    else this.linkDialog();
  },
  backupLocal() { try { localStorage.setItem(KEY + '.beforeCloud', JSON.stringify(S)); } catch (e) {} },
  async useCloud() {
    this.backupLocal();
    const cloud = this.cloudSnapshot || {}, P = this.parts();
    const changes = Object.keys(cloud).map(k => ({ k, j: cloud[k].j, t: cloud[k].t }));
    Object.keys(P).forEach(k => { if (!cloud[k]) changes.push({ k, j: null, t: 0 }); });
    this.meta.base = {}; this.meta.lt = {};
    await this.applyRemote(changes);
    this.meta.linked = true; this.saveMeta();
    this.merged = true;
    this.push(); this.settle();
    toast('Cloud data loaded on this device');
  },
  useLocal() {
    this.backupLocal();
    const cloud = this.cloudSnapshot || {};
    this.meta.base = {}; this.meta.lt = {};
    // every cloud document gets overwritten or, if this device doesn't have it, deleted
    Object.keys(cloud).forEach(k => { this.meta.base[k] = { l: '', c: this.cloudHash(k, cloud[k].j) }; });
    this.meta.linked = true; this.saveMeta();
    this.merged = true;
    this.push(); this.settle();
    toast('Uploading this device\'s data…');
  },

  /* ---------- UI ---------- */
  setState(s) {
    this.state = s;
    const label = SYNC_LABEL[s] || s;
    const pill = $('#sync-pill');
    if (pill) { pill.dataset.state = s; pill.querySelector('span').textContent = s === 'error' ? 'Sync error — tap for details' : label; pill.title = this.user ? this.user.email : ''; }
    const m = $('#sync-btn-m');
    if (m) { m.dataset.state = s; m.title = label; m.setAttribute('aria-label', 'Cloud sync: ' + label); }
    const n = $('#sync-note');
    if (n) n.textContent = this.user ? 'Synced to your cloud account' : 'Data is saved in this browser (localStorage)';
    const card = $('#sync-card');
    if (card) card.innerHTML = this.cardHTML();
  },
  infoHTML() {
    return `<div>Signed in as <b>${esc(this.user.email)}</b></div>
      <div>Status: <b>${SYNC_LABEL[this.state] || this.state}</b>${this.lastSync ? ` · last saved ${this.lastSync.toLocaleTimeString()}` : ''}</div>
      ${this.lastError ? `<div class="sync-err">${esc(this.lastError)}</div>` : ''}
      <div class="muted small">Edits show up on your other signed-in devices within a second or two. Edits made offline are kept and uploaded when you reconnect.</div>`;
  },
  cardHTML() {
    if (!this.user) {
      return `<div class="card-head"><h3>Cloud sync</h3><span class="row small muted" data-state="${this.state}"><i class="sync-dot"></i>${SYNC_LABEL[this.state] || ''}</span></div>
        <p class="muted">Sign in to keep your phone and computer in sync in real time. Without signing in, data stays in this browser only.</p>
        <button class="btn btn-primary" data-action="sync-open">Sign in</button>`;
    }
    return `<div class="card-head"><h3>Cloud sync</h3><span class="row small" data-state="${this.state}"><i class="sync-dot"></i>${SYNC_LABEL[this.state] || ''}</span></div>
      <div class="sync-info">${this.infoHTML()}</div>
      <div class="row mt"><button class="btn" data-action="sync-open">Details</button><button class="btn btn-danger" data-action="sync-signout">Sign out</button></div>`;
  },
  open() {
    if (this.state === 'link') { this.linkDialog(); return; }
    if (this.state === 'unavailable') {
      Modal.open({ title: 'Cloud sync', body: '<p>The sync service could not be loaded. Check your internet connection, then reload the page.</p>', actions: [{ label: 'Close' }, { label: 'Reload', cls: 'btn-primary', onClick: () => location.reload() }] });
      return;
    }
    if (!this.fs) { toast('Cloud sync is still loading…'); return; }
    if (!this.user) { this.signInDialog(); return; }
    Modal.open({
      title: 'Cloud sync', body: `<div class="sync-info">${this.infoHTML()}</div>`,
      actions: [
        { label: 'Sign out', cls: 'left', onClick: () => { this.signOut(); } },
        { label: 'Close' },
        { label: 'Sync now', cls: 'btn-primary', onClick: () => { this.lastError = ''; this.push(); this.settle(); } },
      ],
    });
  },
  signInDialog() {
    Modal.open({
      title: 'Sign in to sync',
      body: `<div class="form">
        <p class="muted small">Use the account you created in Firebase. Your data syncs to every device where you sign in.</p>
        ${field('Email', '<input class="input" type="email" id="sync-email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">')}
        ${field('Password', '<input class="input" type="password" id="sync-pass" autocomplete="current-password">')}
        <div class="sync-err" id="sync-err" role="alert"></div>
        <div><button class="btn btn-ghost btn-sm" data-action="sync-reset">Forgot password?</button></div>
      </div>`,
      actions: [{ label: 'Cancel' }, { label: 'Sign in', cls: 'btn-primary', onClick: () => { this.signIn(); return false; } }],
    });
  },
  async signIn() {
    const email = $('#sync-email').value.trim(), pass = $('#sync-pass').value, err = $('#sync-err');
    if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
    err.textContent = 'Signing in…';
    try { await this.authApi.signInWithEmailAndPassword(this.auth, email, pass); Modal.close(); toast('Signed in — syncing…'); }
    catch (e) { if ($('#sync-err')) $('#sync-err').textContent = this.authMsg(e); }
  },
  async resetPassword() {
    const el = $('#sync-email'), err = $('#sync-err'), email = el ? el.value.trim() : '';
    if (!email) { err.textContent = 'Type your email above first.'; return; }
    try { await this.authApi.sendPasswordResetEmail(this.auth, email); err.textContent = 'If that account exists, a reset link has been sent to it.'; }
    catch (e) { err.textContent = this.authMsg(e); }
  },
  authMsg(e) {
    const c = (e && e.code) || '';
    const M = {
      'auth/invalid-credential': 'Wrong email or password.', 'auth/wrong-password': 'Wrong email or password.', 'auth/user-not-found': 'Wrong email or password.',
      'auth/invalid-email': 'That email address is not valid.', 'auth/user-disabled': 'This account is disabled.',
      'auth/too-many-requests': 'Too many attempts — wait a few minutes, then try again.',
      'auth/network-request-failed': 'Cannot reach the sign-in server. Check your internet connection.',
    };
    return M[c] || `Sign-in failed (${c || (e && e.message) || 'unknown error'}).`;
  },
  async signOut() {
    this.push();
    try { await this.authApi.signOut(this.auth); toast('Signed out — your data stays on this device'); }
    catch (e) { toast('Could not sign out', 'error'); }
  },
  // Used in confirm texts for destructive actions.
  note() { return this.user ? ' This also changes your cloud data, so every signed-in device follows.' : ''; },
};

function migrate(d) {
  if (!d || typeof d !== 'object') throw new Error('Invalid data');
  d.version = d.version || 1;
  d.settings = Object.assign({ theme: 'dark', heightCm: null, activeSeasonId: null, activeWeekId: null }, d.settings || {});
  for (const k of ['seasons', 'library', 'body', 'notes']) if (!Array.isArray(d[k])) d[k] = [];
  d.seasons.forEach(s => {
    s.id = s.id || uid(); s.weeks = Array.isArray(s.weeks) ? s.weeks : [];
    s.weeks.forEach(w => {
      w.id = w.id || uid(); w.days = Array.isArray(w.days) ? w.days : [];
      w.days.forEach(day => {
        day.id = day.id || uid(); day.exercises = Array.isArray(day.exercises) ? day.exercises : [];
        day.exercises.forEach(ex => {
          ex.id = ex.id || uid(); ex.sets = Array.isArray(ex.sets) ? ex.sets : [];
          ex.sets.forEach(st => { st.id = st.id || uid(); });
        });
      });
    });
  });
  d.notes.forEach(n => { n.id = n.id || uid(); n.tags = Array.isArray(n.tags) ? n.tags : []; n.links = Array.isArray(n.links) ? n.links : []; });
  [d.library, d.body].forEach(a => a.forEach(x => { x.id = x.id || uid(); }));
  return d;
}

function emptyData() {
  return migrate({ settings: { theme: S ? S.settings.theme : 'dark' } });
}

function ctxOf(id) {
  if (!id) return null;
  if (id === 'settings') return { type: 'settings', obj: S.settings };
  for (const season of S.seasons) {
    if (season.id === id) return { type: 'season', obj: season, list: S.seasons, season };
    for (const week of season.weeks) {
      if (week.id === id) return { type: 'week', obj: week, list: season.weeks, season, week };
      for (const day of week.days) {
        if (day.id === id) return { type: 'day', obj: day, list: week.days, season, week, day };
        for (const ex of day.exercises) {
          if (ex.id === id) return { type: 'ex', obj: ex, list: day.exercises, season, week, day, ex };
          for (const set of ex.sets) if (set.id === id) return { type: 'set', obj: set, list: ex.sets, season, week, day, ex };
        }
      }
    }
  }
  for (const [type, list] of [['lib', S.library], ['body', S.body], ['note', S.notes], ['photo', PHOTOS]]) {
    const obj = list.find(x => x.id === id);
    if (obj) return { type, obj, list };
  }
  return null;
}
const removeCtx = c => { const i = c.list.indexOf(c.obj); if (i >= 0) c.list.splice(i, 1); return i; };

function activeSeason() {
  let s = S.seasons.find(x => x.id === S.settings.activeSeasonId);
  if (!s && S.seasons.length) { s = S.seasons[S.seasons.length - 1]; S.settings.activeSeasonId = s.id; }
  return s || null;
}
function activeWeek(season) {
  if (!season) return null;
  let w = season.weeks.find(x => x.id === S.settings.activeWeekId);
  if (!w && season.weeks.length) { w = [...season.weeks].sort(byNum).pop(); S.settings.activeWeekId = w.id; }
  return w || null;
}

function cloneSets(sets, mode) {
  const keep = v => mode === 'blank' || v === undefined ? null : v;
  return sets.map(s => {
    const n = { id: uid(), reps: keep(s.reps), weight: keep(s.weight), notes: '', done: false };
    if ('distance' in s || 'duration' in s || 'steps' in s) Object.assign(n, { distance: keep(s.distance), duration: keep(s.duration), steps: keep(s.steps) });
    return n;
  });
}
function cloneEx(ex, mode) {
  return { id: uid(), libraryId: ex.libraryId || null, name: ex.name, muscleGroup: ex.muscleGroup, instructions: ex.instructions, perSide: !!ex.perSide, notes: '', sets: cloneSets(ex.sets, mode) };
}
function cloneDay(day, mode, shift) {
  return { id: uid(), name: day.name, date: day.date ? addDays(day.date, shift) : '', focus: day.focus, completed: false, notes: '', exercises: day.exercises.map(e => cloneEx(e, mode)) };
}

/* ============================================================
   CALC — stats, progression, PRs
   A set counts once it is ticked done and has reps > 0.
   PR = heaviest weight; tie-break = more reps.
   Per-side exercises (single-arm/leg, one dumbbell per hand) log kg per side;
   their volume counts both sides (reps × kg × 2).
   ============================================================ */
let calcCache = null;
const Calc = {
  vol: (s, e) => num(s.reps) * num(s.weight) * (e && e.perSide ? 2 : 1),
  logged: s => !!s.done && num(s.reps) > 0,
  better(a, b) {
    if (!b) return true;
    const aw = num(a.weight), bw = num(b.weight);
    return aw > bw || (aw === bw && num(a.reps) > num(b.reps));
  },
  exTotals(e) {
    let sets = 0, reps = 0, volume = 0, best = null;
    e.sets.forEach(s => {
      if (!Calc.logged(s)) return;
      sets++; reps += num(s.reps); volume += Calc.vol(s, e);
      if (Calc.better(s, best)) best = { weight: num(s.weight), reps: num(s.reps), side: !!e.perSide };
    });
    return { sets, reps, volume, best };
  },
  // Cardio segments count once ticked done and they have a distance, time or steps.
  cardioLogged: s => !!s.done && (num(s.distance) > 0 || num(s.duration) > 0 || num(s.steps) > 0),
  cardioTotals(e) {
    const t = { segs: 0, km: 0, min: 0, steps: 0, sessions: 0 };
    if (!isCardio(e)) return t;
    e.sets.forEach(s => { if (!Calc.cardioLogged(s)) return; t.segs++; t.km += num(s.distance); t.min += num(s.duration); t.steps += num(s.steps); });
    t.sessions = t.segs ? 1 : 0;
    return t;
  },
  // Weekly history of one cardio exercise (by name), oldest first.
  cardioHistory(name) {
    const k = norm(name), A = Calc.analyze(), rows = [];
    A.weeks.forEach(({ season, week, label }, idx) => {
      const r = { season, week, label, idx, km: 0, min: 0, steps: 0, segs: 0, longest: 0 };
      week.days.forEach(d => d.exercises.forEach(e => {
        if (norm(e.name) !== k || !isCardio(e)) return;
        const t = Calc.cardioTotals(e);
        r.km += t.km; r.min += t.min; r.steps += t.steps; r.segs += t.segs; r.longest = Math.max(r.longest, t.km);
      }));
      if (r.segs) rows.push(r);
    });
    return rows;
  },
  dayTotals(d) {
    let sets = 0, reps = 0, volume = 0, km = 0, min = 0, steps = 0, cardio = 0;
    d.exercises.forEach(e => {
      const t = Calc.exTotals(e); sets += t.sets; reps += t.reps; volume += t.volume;
      const c = Calc.cardioTotals(e); km += c.km; min += c.min; steps += c.steps; cardio += c.sessions;
    });
    return { sets, reps, volume, km, min, steps, cardio, isWorkout: !!d.completed || sets > 0 || cardio > 0 };
  },
  weekTotals(week) {
    const t = { workouts: 0, sets: 0, reps: 0, volume: 0, exercises: 0, doneDays: 0, days: week.days.length, km: 0, min: 0, steps: 0, cardio: 0 };
    week.days.forEach(d => {
      const dt = Calc.dayTotals(d);
      t.sets += dt.sets; t.reps += dt.reps; t.volume += dt.volume; t.exercises += d.exercises.length;
      t.km += dt.km; t.min += dt.min; t.steps += dt.steps; t.cardio += dt.cardio;
      if (dt.isWorkout) t.workouts++;
      if (d.completed) t.doneDays++;
    });
    return t;
  },
  // Full chronological analysis across all seasons. Cached until the next save.
  analyze() {
    if (calcCache && calcCache.rev === REV) return calcCache;
    const multi = S.seasons.length > 1;
    const weeks = [];
    S.seasons.forEach(season => [...season.weeks].sort(byNum).forEach(week => {
      weeks.push({ season, week, label: (multi ? season.name + ' · ' : '') + 'W' + week.number });
    }));
    const ex = {}, prInfo = {}, prSet = {}, prEvents = [];
    weeks.forEach(({ season, week, label }, idx) => {
      [...week.days].sort(byDate).forEach(day => day.exercises.forEach(e => {
        const k = norm(e.name);
        if (!k) return;
        const rec = ex[k] || (ex[k] = { key: k, name: e.name, muscle: e.muscleGroup, rows: [] });
        rec.name = e.name; rec.muscle = e.muscleGroup || 'Other';
        let row = rec.rows.find(r => r.week === week);
        if (!row) { row = { season, week, label, idx, date: day.date, best: null, sets: 0, reps: 0, volume: 0 }; rec.rows.push(row); }
        e.sets.forEach(s => {
          if (!Calc.logged(s)) return;
          row.sets++; row.reps += num(s.reps); row.volume += Calc.vol(s, e);
          const cur = { weight: num(s.weight), reps: num(s.reps), side: !!e.perSide };
          if (Calc.better(cur, row.best)) row.best = cur;
          const prev = prInfo[k];
          if (Calc.better(cur, prev)) {
            if (prev) prEvents.push({ key: k, name: e.name, weight: cur.weight, reps: cur.reps, side: cur.side, prev: { weight: prev.weight, reps: prev.reps, side: prev.side }, date: day.date, label, season, week, setId: s.id });
            prInfo[k] = { ...cur, date: day.date, label, season, week };
            prSet[k] = s.id;
          }
        });
      }));
    });
    Object.values(ex).forEach(r => { r.rows = r.rows.filter(x => x.sets > 0); });
    calcCache = { rev: REV, weeks, ex, prInfo, prEvents, prSetIds: new Set(Object.values(prSet)) };
    return calcCache;
  },
  totals(seasonId) {
    const A = Calc.analyze();
    const T = { workouts: 0, exercises: 0, unique: new Set(), sets: 0, reps: 0, volume: 0, perWeek: [], muscle: {}, km: 0, min: 0, steps: 0, cardio: 0 };
    A.weeks.filter(x => seasonId === 'all' || x.season.id === seasonId).forEach(({ season, week, label }) => {
      const wt = Calc.weekTotals(week);
      T.workouts += wt.workouts; T.sets += wt.sets; T.reps += wt.reps; T.volume += wt.volume;
      T.km += wt.km; T.min += wt.min; T.steps += wt.steps; T.cardio += wt.cardio;
      T.perWeek.push({ label, season, week, ...wt });
      week.days.forEach(d => d.exercises.forEach(e => {
        T.exercises++; T.unique.add(norm(e.name));
        const v = Calc.exTotals(e).volume;
        if (v) { const m = e.muscleGroup || 'Other'; T.muscle[m] = (T.muscle[m] || 0) + v; }
      }));
    });
    T.avg = T.workouts ? T.volume / T.workouts : 0;
    return T;
  },
  exCompare(e, week) {
    const A = Calc.analyze();
    const rec = A.ex[norm(e.name)];
    if (!rec) return {};
    const wi = A.weeks.findIndex(x => x.week === week);
    const cur = rec.rows.find(r => r.idx === wi);
    const prev = [...rec.rows].reverse().find(r => r.idx < wi);
    return { cur, prev, pr: A.prInfo[rec.key] };
  },
  lastOccurrence(name) {
    const k = norm(name);
    let found = null;
    S.seasons.forEach(s => [...s.weeks].sort(byNum).forEach(w => w.days.forEach(d => d.exercises.forEach(e => { if (norm(e.name) === k) found = e; }))));
    return found;
  },
};

const MM_GROUP_FALLBACK = {
  Chest: { p: ['chest'], s: [] }, Back: { p: ['lats', 'upperback'], s: [] }, Legs: { p: ['quads'], s: ['hamstrings', 'glutes'] },
  Glutes: { p: ['glutes'], s: [] }, Shoulders: { p: ['shoulders'], s: [] }, Arms: { p: ['biceps', 'triceps'], s: [] },
  Core: { p: ['abs'], s: ['obliques'] }, 'Full Body': { p: [], s: ['quads', 'glutes', 'upperback', 'chest'] },
};
const hasMuscles = m => !!(m && ((m.p && m.p.length) || (m.s && m.s.length)));
const sameMuscles = (a, b) => [...a.p].sort().join() === [...b.p].sort().join() && [...a.s].sort().join() === [...b.s].sort().join();

function autoMuscles(name, group) {
  const n = norm(name);
  for (const [re, p, s] of MM_RULES) if (re.test(n)) return { p, s, src: 'name' };
  const g = MM_GROUP_FALLBACK[group];
  return g ? { p: g.p, s: g.s, src: 'group' } : { p: [], s: [], src: 'none' };
}
function musclesFor(e) {
  if (hasMuscles(e.muscles)) return { p: e.muscles.p || [], s: e.muscles.s || [], src: 'custom' };
  const lib = (e.libraryId && S.library.find(l => l.id === e.libraryId)) || S.library.find(l => norm(l.name) === norm(e.name));
  if (lib && hasMuscles(lib.muscles)) return { p: lib.muscles.p || [], s: lib.muscles.s || [], src: 'library' };
  return autoMuscles(e.name, e.muscleGroup);
}

const MM = {
  last: null, hover: null,
  compute(range, seasonId) {
    const today = todayISO();
    const start = range === 'all' ? null : addDays(today, -(Number(range) - 1));
    const per = {};
    MM_MUSCLES.forEach(m => { per[m.id] = { direct: 0, indirect: 0, reps: 0, volume: 0, days: new Set(), last: '', ex: {} }; });
    let first = null, totalSets = 0;
    S.seasons.forEach(season => {
      if (seasonId !== 'all' && season.id !== seasonId) return;
      season.weeks.forEach(w => w.days.forEach(d => {
        if (start && (!d.date || d.date < start || d.date > today)) return;
        d.exercises.forEach(e => {
          const sets = e.sets.filter(Calc.logged);
          if (!sets.length) return;
          const { p, s } = musclesFor(e);
          const reps = sets.reduce((a, x) => a + num(x.reps), 0);
          const vol = sets.reduce((a, x) => a + Calc.vol(x, e), 0);
          totalSets += sets.length;
          if (d.date && (!first || d.date < first)) first = d.date;
          const add = (id, role) => {
            const r = per[id];
            if (!r) return;
            if (role === 'p') { r.direct += sets.length; r.reps += reps; r.volume += vol; } else r.indirect += sets.length;
            r.days.add(d.id);
            if (d.date && d.date > r.last) r.last = d.date;
            const x = r.ex[e.name] || (r.ex[e.name] = { sets: 0, role });
            x.sets += sets.length;
            if (role === 'p') x.role = 'p';
          };
          p.forEach(id => add(id, 'p'));
          s.filter(id => !p.includes(id)).forEach(id => add(id, 's'));
        });
      }));
    });
    const days = start ? Number(range) : (first ? diffDays(today, first) + 1 : 7);
    const weeks = Math.max(1, days / 7);
    Object.values(per).forEach(r => { r.eff = (r.direct + 0.5 * r.indirect) / weeks; r.level = mmLevel(r.eff); r.workouts = r.days.size; });
    return { per, weeks, start, totalSets, range };
  },
};

function mmFigureSVG(view, R) {
  const MIR = 'transform="matrix(-1 0 0 1 200 0)"';
  const pair = (d, attrs) => `<path d="${d}" ${attrs}/><path d="${d}" ${attrs} ${MIR}/>`;
  const plate = ATLAS[view];
  const angles = [...new Set(plate.muscles.map(x => x.a))];
  const defs = angles.map(a => `<pattern id="fib-${view}-${a}" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(${a})"><line x1="0" y1="0" x2="0" y2="2.6" style="stroke:var(--mm-fiber)" stroke-width=".55"/></pattern>`).join('');
  const seen = new Set();
  const muscles = plate.muscles.map(x => {
    const r = R.per[x.m], L = MM_LEVELS[r.level], m = MM_BY[x.m];
    const focusable = !seen.has(x.m);
    seen.add(x.m);
    const a11y = focusable ? `tabindex="0" role="button" aria-label="${esc(`${m.name}: ${L.name}, ${fmt(r.eff, 1)} effective sets per week`)}"` : 'aria-hidden="true"';
    return `<g class="mm-g ${UI.mmSel === x.m ? 'sel' : ''}" data-action="mm-select" data-m="${x.m}" data-level="${r.level}" ${a11y}>
      ${pair(x.d, 'class="m-fill"')}${pair(x.d, `class="m-fib" fill="url(#fib-${view}-${x.a})"`)}${(x.det || []).map(d => pair(d, 'class="m-det"')).join('')}</g>`;
  }).join('');
  const decor = plate.decor.map(x => x.c ? `<path d="${x.d}" class="${x.cls}"/>` : pair(x.d, `class="${x.cls}"`)).join('');
  const [l, r] = view === 'front' ? ['R', 'L'] : ['L', 'R'];
  return `<figure class="mm-fig"><svg viewBox="0 0 200 470" role="group" aria-label="${view === 'front' ? 'Anterior' : 'Posterior'} view">
      <defs>${defs}</defs>
      ${ATLAS.base.map(d => pair(d, 'class="mm-skin"')).join('')}
      <ellipse cx="100" cy="34" rx="18" ry="24" class="mm-skin"/>
      ${decor}${muscles}
      <text x="10" y="18" class="mm-lbl">${l}</text><text x="184" y="18" class="mm-lbl">${r}</text>
    </svg><figcaption>${view === 'front' ? 'Anterior view' : 'Posterior view'}</figcaption></figure>`;
}

const TORSO_PROFILE = [[0, 0.84], [0.09, 0.845], [0.115, 0.86], [0.16, 0.92], [0.153, 0.98], [0.138, 1.06], [0.148, 1.14], [0.168, 1.24], [0.18, 1.33], [0.164, 1.42], [0.106, 1.47], [0.06, 1.495], [0, 1.5]];

const MM3D_GAIN = { shoulders: 1.3, chest: 1.26, biceps: 1.3, triceps: 1.3, forearms: 1.18, abs: 1.12, obliques: 1.15, lats: 1.26, upperback: 1.25, lowerback: 1.15, glutes: 1.18, quads: 1.26, hamstrings: 1.22, adductors: 1.15, calves: 1.24 };
const TORSO_DEPTH = 0.62;
function torsoR(y) {
  const P = TORSO_PROFILE.slice(2, -1);
  if (y <= P[0][1]) return P[0][0];
  for (let i = 1; i < P.length; i++) if (y <= P[i][1]) { const [r0, y0] = P[i - 1], [r1, y1] = P[i]; return r0 + (r1 - r0) * (y - y0) / (y1 - y0); }
  return P[P.length - 1][0];
}
// point on the torso surface (front: sign 1, back: sign -1), pushed out by `off`
const onTorso = (x, y, off, sign) => { const R = torsoR(y); return [x, y, sign * (TORSO_DEPTH * Math.sqrt(Math.max(0, R * R - x * x)) + off)]; };
const F = (x, y, off) => onTorso(x, y, off, 1);
const B = (x, y, off) => onTorso(x, y, off, -1);

function tubeGeometry(THREE, pts, out, o) {
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const SEG = 28, RAD = 16, r0 = o.r, w = o.w || 1, d = o.d || 1;
  const prof = o.prof || (t => Math.pow(Math.sin(Math.PI * t), 0.55));
  const hint = out.clone().normalize();
  const pos = [], uv = [], idx = [];
  const side = new THREE.Vector3(), n = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG, c = curve.getPoint(t), T = curve.getTangent(t).normalize();
    side.crossVectors(T, hint);
    if (side.lengthSq() < 1e-8) side.set(1, 0, 0);
    side.normalize();
    n.crossVectors(side, T).normalize();
    const r = r0 * Math.max(prof(t), 0.04);
    for (let j = 0; j <= RAD; j++) {
      const a = j / RAD * Math.PI * 2, cs = Math.cos(a), sn = Math.sin(a);
      // flattened toward the body: the deep face bulges less than the superficial face
      v.copy(c).addScaledVector(side, r * w * cs).addScaledVector(n, r * d * sn * (sn < 0 ? 0.55 : 1));
      pos.push(v.x, v.y, v.z);
      uv.push(j / RAD, t);
    }
  }
  for (let i = 0; i < SEG; i++) for (let j = 0; j < RAD; j++) {
    const a = i * (RAD + 1) + j, b = a + RAD + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);

  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}

function heroEyeGeometry(THREE, E, sx, k, off) {
  const cx = 0.046, cy = 0.006, RINGS = 5; // outer edge stays inside the head width so nothing shows from behind

    pos.push(X, Y, E.c * Math.sqrt(Math.max(0, q)) + off);
    uv.push(x * k / 0.035, y * k / 0.035);

  vert(0, 0);
  for (let r = 1; r <= RINGS; r++) ring.forEach(p => vert(p.x * r / RINGS, p.y * r / RINGS));
