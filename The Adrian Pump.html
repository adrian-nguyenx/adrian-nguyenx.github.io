    this.updateMask();
    s.dirty = true;
  },
  fade(mat, on, opacity) {
    if (mat.transparent === on) return;
    mat.transparent = on; mat.opacity = on ? opacity : 1; mat.depthWrite = !on; mat.needsUpdate = true;
  },
  apply(R) {
    const s = this.s;
    if (!s) return;
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    MM_MUSCLES.forEach(m => s.mats[m.id].color.set(css(`--mm-${R.per[m.id].level}`)));
    this.select(UI.mmSel);
  },
  select(id) {
    const s = this.s;
    if (!s) return;
    s.sel = id;
    const lab = $('#mm3d-label');
    if (lab) lab.textContent = id && MM_BY[id] ? MM_BY[id].name : '';
    this.highlight();
  },
  view(name) { if (this.s) { this.s.goal = { theta: this.VIEWS[name] || 0, phi: 0.06 }; this.s.auto = false; this.syncButtons(); } },
  zoom(dir) { const s = this.s; if (s) { s.goal = null; s.dist = Math.min(5.2, Math.max(1.1, s.dist * (dir > 0 ? 1.15 : 0.87))); s.dirty = true; } },
  toggle(key) { const s = this.s; if (!s) return; s[key] = !s[key]; if (key === 'isolate') this.highlight(); this.syncButtons(); },
  syncButtons() {
    const s = this.s;
    const r = $('#mm3d-rot'), i = $('#mm3d-iso');
    if (r) r.setAttribute('aria-pressed', String(!!(s && s.auto)));
    if (i) i.setAttribute('aria-pressed', String(!!(s && s.isolate)));
    const k = $('#mm3d-mask');
    if (k) k.setAttribute('aria-pressed', String(!!S.settings.heroMask));
  },
  resize() {
    const s = this.s;
    if (!s) return;
    s.w = Math.max(1, s.stage.clientWidth); s.h = Math.max(1, s.stage.clientHeight);
    s.renderer.setSize(s.w, s.h);
    s.camera.aspect = s.w / s.h;
    s.camera.updateProjectionMatrix();
    s.dirty = true;
  },
  tick() {
    const s = this.s;
    if (!s) return;
    s.raf = requestAnimationFrame(() => this.tick());
    if (s.goal) {
      const dT = Math.atan2(Math.sin(s.goal.theta - s.theta), Math.cos(s.goal.theta - s.theta));
      s.theta += dT * 0.14;
      s.phi += (s.goal.phi - s.phi) * 0.14;
      if (s.goal.dist) s.dist += (s.goal.dist - s.dist) * 0.14;
      if (Math.abs(dT) < 0.002 && Math.abs(s.goal.phi - s.phi) < 0.002) s.goal = null;
      s.dirty = true;
    }
    if (s.auto) { s.theta += 0.005; s.dirty = true; }
    if (s.mask && s.mask.t !== s.mask.target) {
      const step = 0.07, d = s.mask.target - s.mask.t;
      s.mask.t = Math.abs(d) <= step ? s.mask.target : s.mask.t + Math.sign(d) * step;
      this.updateMask();
    }
    if (!s.dirty) return;
    s.dirty = false;
    const c = Math.cos(s.phi);
    s.camera.position.set(s.target.x + s.dist * Math.sin(s.theta) * c, s.target.y + s.dist * Math.sin(s.phi), s.target.z + s.dist * Math.cos(s.theta) * c);
    s.camera.lookAt(s.target);
    s.renderer.render(s.scene, s.camera);
    this.updateLabel();
    this.updateOrient();
  },
  updateLabel() {
    const s = this.s, lab = $('#mm3d-label');
    if (!lab) return;
    const pts = s.sel && s.anchors[s.sel];
    if (!pts) { lab.classList.add('hidden'); return; }
    const cx = Math.sin(s.theta), cz = Math.cos(s.theta);
    let best = null, bd = -Infinity;
    pts.forEach(p => { const d = p.x * cx + p.z * cz; if (d > bd) { bd = d; best = p; } });
    const v = best.clone().project(s.camera);
    if (bd < -0.015 || v.z > 1) { lab.classList.add('hidden'); return; }
    lab.style.left = ((v.x + 1) / 2 * s.w) + 'px';
    lab.style.top = ((1 - v.y) / 2 * s.h) + 'px';
    lab.classList.remove('hidden');
  },
  updateOrient() {
    const s = this.s, t = ((s.theta % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const o = t < Math.PI / 4 || t >= 7 * Math.PI / 4 ? 'Anterior view' : t < 3 * Math.PI / 4 ? 'Left lateral view' : t < 5 * Math.PI / 4 ? 'Posterior view' : 'Right lateral view';
    if (o === s.orient) return;
    s.orient = o;
    const el = $('#mm3d-orient');
    if (el) el.textContent = o;
  },
  dispose() {
    const s = this.s;
    if (!s) return;
    cancelAnimationFrame(s.raf);
    if (s.ro) s.ro.disconnect();
    s.listeners.forEach(([t, f, o]) => s.renderer.domElement.removeEventListener(t, f, o));
    s.geos.forEach(g => g.dispose());
    [...Object.values(s.mats), s.offMat, s.coreMat, ...(s.mask ? Object.values(s.mask.mats) : [])].forEach(m => m && m.dispose());
    s.textures.forEach(t => t.dispose());
    s.renderer.dispose();
    s.renderer.forceContextLoss();
    s.renderer.domElement.remove();
    this.s = null;
    MM.hover = null;
  },
};

/* ============================================================
   CHARTS (Chart.js)
   ============================================================ */
const Charts = {
  inst: {},
  colors() {
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    return { text: v('--muted'), grid: v('--border'), accent: v('--accent-strong'), fill: v('--accent'), blue: v('--blue'), orange: v('--orange'), surface: v('--surface'), fg: v('--text') };
  },
  palette() {
    const c = this.colors();
    return [c.accent, c.blue, c.orange, '#e86bb0', '#9b7bff', '#2ec4b6', '#f6c343', '#ff6b6b', '#8b919c', '#5fd068'];
  },
  destroyAll() { Object.values(this.inst).forEach(c => c.destroy()); this.inst = {}; },
  make(id, cfg) {
    const el = document.getElementById(id);
    if (!el) return;
    if (this.inst[id]) { this.inst[id].destroy(); delete this.inst[id]; }
    if (typeof Chart === 'undefined') { el.parentElement.innerHTML = '<div class="list-empty">Charts need an internet connection the first time (Chart.js CDN).</div>'; return; }
    this.inst[id] = new Chart(el, cfg);
  },
  opts({ y1 = false, legend = true } = {}) {
    const c = this.colors();
    const o = {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: legend, labels: { color: c.text, boxWidth: 8, boxHeight: 8, usePointStyle: true, font: { size: 12 } } },
        tooltip: { backgroundColor: c.surface, titleColor: c.fg, bodyColor: c.fg, borderColor: c.grid, borderWidth: 1, padding: 10, boxPadding: 4 },
      },
      scales: {
        x: { ticks: { color: c.text, maxRotation: 0, autoSkip: true }, grid: { display: false }, border: { color: c.grid } },
        y: { beginAtZero: true, ticks: { color: c.text }, grid: { color: c.grid }, border: { display: false } },
      },
    };
    if (y1) o.scales.y1 = { position: 'right', beginAtZero: true, ticks: { color: c.text }, grid: { display: false }, border: { display: false } };
    return o;
  },
  weeklyVolume(id, perWeek) {
    const c = this.colors();
    const o = this.opts({ legend: false });
    o.plugins.tooltip.callbacks = { label: i => ` ${fmtInt(i.raw)} kg` };
    this.make(id, { type: 'bar', data: { labels: perWeek.map(w => w.label), datasets: [{ label: 'Volume (kg)', data: perWeek.map(w => Math.round(w.volume)), backgroundColor: c.accent, borderRadius: 6, maxBarThickness: 48 }] }, options: o });
  },
  cardio(id, perWeek) {
    const c = this.colors();
    const o = this.opts({ y1: true });
    o.scales.y.title = { display: true, text: 'km', color: c.text };
    o.scales.y1.title = { display: true, text: 'min', color: c.text };
    o.plugins.tooltip.callbacks = { label: i => i.datasetIndex === 0 ? ` ${fmt(i.raw, 2)} km` : ` ${fmtDurLong(i.raw)}` };
    this.make(id, {
      type: 'bar',
      data: {
        labels: perWeek.map(w => w.label),
        datasets: [
          { label: 'Distance (km)', data: perWeek.map(w => +num(w.km).toFixed(2)), backgroundColor: c.orange, borderRadius: 6, maxBarThickness: 40, yAxisID: 'y', order: 2 },
          { label: 'Time (min)', data: perWeek.map(w => Math.round(num(w.min))), type: 'line', borderColor: c.blue, backgroundColor: c.blue, tension: .3, pointRadius: 3, yAxisID: 'y1', order: 1 },
        ],
      },
      options: o,
    });
  },
  frequency(id, perWeek) {
    const c = this.colors();
    const o = this.opts();
    o.scales.y.ticks.stepSize = 1;
    this.make(id, {
      type: 'bar',
      data: {
        labels: perWeek.map(w => w.label),
        datasets: [
          { label: 'Workouts done', data: perWeek.map(w => w.workouts), backgroundColor: c.blue, borderRadius: 6, maxBarThickness: 36 },
          { label: 'Planned days', data: perWeek.map(w => w.days), backgroundColor: c.grid, borderRadius: 6, maxBarThickness: 36 },
        ],
      },
      options: o,
    });
  },
  progression(id, key, seasonId) {
    const A = Calc.analyze();
    const rec = A.ex[key];
    const rows = rec ? rec.rows.filter(r => seasonId === 'all' || r.season.id === seasonId) : [];
    const c = this.colors();
    const o = this.opts({ y1: true });
    o.scales.y.beginAtZero = false;
    o.scales.y.title = { display: true, text: 'Top weight (kg)', color: c.text };
    o.scales.y1.title = { display: true, text: 'Volume (kg)', color: c.text };
    o.plugins.tooltip.callbacks = { afterBody: items => { const r = rows[items[0].dataIndex]; return r ? [`Best set: ${setStr(r.best)}`, `Sets: ${r.sets} · Reps: ${r.reps}`] : []; } };
    this.make(id, {
      type: 'bar',
      data: {
        labels: rows.map(r => r.label),
        datasets: [
          { type: 'line', label: 'Top weight (kg)', data: rows.map(r => r.best ? r.best.weight : null), borderColor: c.accent, backgroundColor: c.accent, yAxisID: 'y', tension: .3, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5, order: 0 },
          { type: 'bar', label: 'Volume (kg)', data: rows.map(r => Math.round(r.volume)), backgroundColor: c.blue + '66', borderRadius: 6, yAxisID: 'y1', maxBarThickness: 40, order: 1 },
        ],
      },
      options: o,
    });
  },
  body(id, body, withMA) {
    const c = this.colors();
    const o = this.opts({ y1: true });
    o.scales.y.beginAtZero = false;
    o.scales.y1.beginAtZero = false;
    o.scales.y.title = { display: true, text: 'kg', color: c.text };
    o.scales.y1.title = { display: true, text: 'Body fat %', color: c.text };
    const ma = body.map((_, i) => { const w = body.slice(Math.max(0, i - 6), i + 1).map(b => num(b.weight)).filter(Boolean); return w.length ? +(w.reduce((a, b) => a + b, 0) / w.length).toFixed(2) : null; });
    const ds = [{ label: 'Weight (kg)', data: body.map(b => num(b.weight) || null), borderColor: c.accent, backgroundColor: c.accent, tension: .3, pointRadius: 3, borderWidth: 2.5, yAxisID: 'y' }];
    if (withMA) ds.push({ label: '7-entry avg', data: ma, borderColor: c.text, borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, tension: .3, yAxisID: 'y' });
    ds.push({ label: 'Body fat %', data: body.map(b => (b.bodyFat === null || b.bodyFat === '' || b.bodyFat === undefined) ? null : num(b.bodyFat)), borderColor: c.orange, backgroundColor: c.orange, tension: .3, pointRadius: 3, borderWidth: 2, yAxisID: 'y1', spanGaps: true });
    this.make(id, { type: 'line', data: { labels: body.map(b => fmtDate(b.date)), datasets: ds }, options: o });
  },
  muscle(id, muscle) {
    const c = this.colors();
    const entries = Object.entries(muscle).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((a, [, v]) => a + v, 0);
    this.make(id, {
      type: 'doughnut',
      data: { labels: entries.map(e => e[0]), datasets: [{ data: entries.map(e => Math.round(e[1])), backgroundColor: this.palette(), borderColor: c.surface, borderWidth: 3 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: {
          legend: { position: window.innerWidth < 600 ? 'bottom' : 'right', labels: { color: c.text, boxWidth: 8, boxHeight: 8, usePointStyle: true } },
          tooltip: { backgroundColor: c.surface, titleColor: c.fg, bodyColor: c.fg, borderColor: c.grid, borderWidth: 1, padding: 10, callbacks: { label: i => ` ${fmtInt(i.raw)} kg (${total ? Math.round(i.raw / total * 100) : 0}%)` } },
        },
      },
    });
  },
};

const Modal = {
  actions: [], token: 0, onClose: null,
  open({ title, body, actions = [], wide = false, onClose = null }) {
    if (this.onClose) { const f = this.onClose; this.onClose = null; f(); }
    this.token++;
    this.actions = actions;
    this.onClose = onClose;
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-backdrop"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${icon('x')}</button></div>
      <div class="modal-body">${body}</div>
      ${actions.length ? `<div class="modal-foot">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-modal-act="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div></div>`;
    const f = root.querySelector('.modal-body input:not([type=checkbox]):not([type=radio]):not([type=file]), .modal-body textarea');
    if (f && window.innerWidth > 768) f.focus();
  },
  close() {
    $('#modal-root').innerHTML = '';
    this.actions = [];
    if (this.onClose) { const f = this.onClose; this.onClose = null; f(); }
  },
  isOpen: () => !!$('#modal-root').firstElementChild,
};

function confirmDialog(message, { title = 'Are you sure?', ok = 'Delete', danger = true, requireText = '' } = {}) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    Modal.open({
      title,
      body: `<p>${message}</p>${requireText ? `<label class="field mt"><span>Type ${requireText} to confirm</span><input class="input" id="confirm-text" autocomplete="off"></label>` : ''}`,
      actions: [
        { label: 'Cancel', onClick: () => finish(false) },
        { label: ok, cls: danger ? 'btn-danger-solid' : 'btn-primary', onClick: () => {
          if (requireText && $('#confirm-text').value.trim() !== requireText) { toast(`Please type ${requireText}`, 'error'); return false; }
          finish(true);
        } },
      ],
      onClose: () => finish(false),
    });
  });
}

function toast(msg, type = '', action = null) {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { action.fn(); t.remove(); };
    t.appendChild(b);
  }
  $('#toasts').appendChild(t);
  const life = action ? 5000 : 2800;
  setTimeout(() => t.classList.add('out'), life - 300);
  setTimeout(() => t.remove(), life);
}

          ${T.perWeek.slice().reverse().map(w => `<tr class="clickable" data-action="goto-week" data-id="${w.week.id}"><td><b>${esc(w.label)}</b></td><td class="muted">${fmtRange(w.week.startDate, w.week.endDate)}</td><td>${w.workouts}/${w.days}</td><td class="num-cell">${w.sets}</td><td class="num-cell">${fmtInt(w.volume)} kg</td><td class="num-cell">${w.km || w.min ? `${fmt(w.km, 1)} km` : '—'}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="list-empty">No weeks yet.</div>'}
      </div>

}

/* ---------- Muscle map card ---------- */
function renderMuscleMap() {
  const el = $('#mm-card');
  if (!el) return;
  MM3D.dispose();
  const mode = MM3D.failed || S.settings.mmMode === '2d' ? '2d' : '3d';
  el.innerHTML = `
    <div class="card-head">
      <div><h3>Muscle map</h3><div class="muted small" id="mm-sub"></div></div>
      <div class="row">
        <div class="seg" role="tablist" aria-label="Display">${[['3d', '3D model'], ['2d', '2D atlas']].map(([k, l]) => `<button class="seg-btn ${mode === k ? 'active' : ''}" role="tab" aria-selected="${mode === k}" data-action="mm-mode" data-mode="${k}" ${k === '3d' && MM3D.failed ? 'disabled title="3D is unavailable (offline or no WebGL)"' : ''}>${l}</button>`).join('')}</div>
        <div class="seg" role="tablist" aria-label="Time range">${MM_RANGES.map(([k, l]) => `<button class="seg-btn" role="tab" data-action="mm-range" data-range="${k}">${l}</button>`).join('')}</div>
      </div>
    </div>
    <div class="mm-layout">
      <div id="mm-viz">${mode === '3d' ? MM3D.shellHTML() : ''}</div>
      <div class="mm-detail" id="mm-detail"></div>
    </div>
    <div class="mm-legend">
      ${MM_LEVELS.map((L, i) => `<div><span class="mm-sw" data-level="${i}"></span><b>${L.sym} ${L.name}</b><span class="muted">${L.desc}</span></div>`).join('')}
    </div>
    <p class="mm-note">Effective sets = direct sets + ½ × indirect sets, averaged per week over the selected period. Only sets ticked ✓ count. Target muscles are detected from each exercise's name — edit an exercise to change them.</p>
    <div class="mm-list" id="mm-list"></div>
    <div class="mm-tip hidden" id="mm-tip" role="tooltip"></div>`;
  mmUpdate();
  if (mode === '3d') {
    MM3D.mount($('#mm-stage'))
      .then(() => { if (MM3D.s && MM.last) MM3D.apply(MM.last); })
      .catch(err => {
        console.warn('3D muscle map unavailable:', err);
        MM3D.failed = true;
        MM3D.dispose();
        if ($('#mm-card')) { renderMuscleMap(); toast('3D model unavailable (offline or no WebGL) — showing the 2D atlas'); }

}

// Recompute for the current range/season and refresh everything except the 3D scene itself.
function mmUpdate() {
  if (!$('#mm-card')) return;
  const R = MM.compute(UI.mmRange, UI.dashSeason);
  MM.last = R; MM.hover = null;
  const ranked = [...MM_MUSCLES].sort((a, b) => R.per[b.id].eff - R.per[a.id].eff || a.name.localeCompare(b.name));
  if (!UI.mmSel || !MM_BY[UI.mmSel]) UI.mmSel = ranked[0].id;
  const season = UI.dashSeason !== 'all' && S.seasons.find(s => s.id === UI.dashSeason);
  const rangeText = R.start ? `${fmtDateFull(R.start)} – ${fmtDateFull(todayISO())}` : 'All history';
  const max = Math.max(12, ...ranked.map(m => R.per[m.id].eff));
  $('#mm-sub').innerHTML = `${rangeText}${season ? ' · ' + esc(season.name) : ''} · ${R.totalSets ? `${R.totalSets} completed sets analysed` : 'no completed sets in this period'}`;
  $$('[data-action="mm-range"]').forEach(b => { const on = b.dataset.range === UI.mmRange; b.classList.toggle('active', on); b.setAttribute('aria-selected', String(on)); });
  $('#mm-detail').innerHTML = mmDetailHTML(UI.mmSel, R);
  $('#mm-list').innerHTML = ranked.map(m => { const r = R.per[m.id], L = MM_LEVELS[r.level]; return `<button class="mm-row ${UI.mmSel === m.id ? 'sel' : ''}" data-action="mm-select" data-m="${m.id}" aria-label="${esc(`${m.name}: ${L.name}, ${fmt(r.eff, 1)} sets per week`)}"><span title="${L.name}">${L.sym}</span><span>${m.name}</span><span class="mm-bar"><i data-level="${r.level}" style="width:${Math.min(100, r.eff / max * 100)}%"></i></span><span class="mm-rv">${fmt(r.eff, 1)}</span></button>`; }).join('');
  if ($('#mm3d')) MM3D.apply(R);
  else $('#mm-viz').innerHTML = `<div class="mm-figs">${mmFigureSVG('front', R)}${mmFigureSVG('back', R)}</div>`;
}

function mmDetailHTML(id, R) {
  const m = MM_BY[id], r = R.per[id], L = MM_LEVELS[r.level];
  const ex = Object.entries(r.ex).sort((a, b) => (a[1].role === b[1].role ? 0 : a[1].role === 'p' ? -1 : 1) || b[1].sets - a[1].sets).slice(0, 6);
  const ago = r.last ? diffDays(todayISO(), r.last) : null;
  const agoText = ago === null ? '' : ago <= 0 ? 'today' : ago === 1 ? 'yesterday' : `${ago} days ago`;
  const stat = (l, v) => `<div><b>${v}</b><span>${l}</span></div>`;
  return `<div class="eyebrow">${m.views.map(v => v === 'front' ? 'Anterior' : 'Posterior').join(' · ')}</div>
    <h2 class="mm-name">${m.name} <span class="muted" style="font-size:15px;font-weight:500">${m.vi}</span></h2>
    <div class="muted small mm-latin">${m.latin}</div>
    <div class="mm-level"><span class="mm-sw" data-level="${r.level}"></span><b>${L.sym} ${L.name}</b><span class="muted">· ${fmt(r.eff, 1)} effective sets / week</span></div>
    <div class="mm-stats">
      ${stat('Workouts', r.workouts)}${stat('Direct sets', r.direct)}${stat('Indirect sets', r.indirect)}
      ${stat('Reps (direct)', fmtInt(r.reps))}${stat('Volume (direct)', `${fmtInt(r.volume)}<small>kg</small>`)}${stat('Last trained', r.last ? `${fmtDate(r.last)}<small>${agoText}</small>` : '—')}
    </div>
    ${ex.length ? `<h3 class="mt">Exercises</h3><div class="mm-ex">${ex.map(([n, v]) => `<div><span>${esc(n)}</span><span class="tag">${v.role === 'p' ? 'Primary' : 'Secondary'}</span><b>${v.sets} sets</b></div>`).join('')}</div>`
      : '<p class="muted mt">No completed sets for this muscle in the selected period.</p>'}`;
}

function mmSelect(id) {
  if (!MM_BY[id] || !MM.last) return;
  UI.mmSel = id;
  $$('.mm-g').forEach(g => g.classList.toggle('sel', g.dataset.m === id));
  $$('.mm-row').forEach(b => b.classList.toggle('sel', b.dataset.m === id));
  const d = $('#mm-detail');
  if (d) d.innerHTML = mmDetailHTML(id, MM.last);
  MM3D.select(id);
}

function mmHover(id) {
  if (MM.hover === id) return;
  MM.hover = id;
  $$('.mm-g.hov').forEach(g => g.classList.remove('hov'));
  const tip = $('#mm-tip');
  if (!tip) return;
  if (!id || !MM.last) { tip.classList.add('hidden'); return; }
  $$(`.mm-g[data-m="${id}"]`).forEach(g => g.classList.add('hov'));
  const m = MM_BY[id], r = MM.last.per[id], L = MM_LEVELS[r.level];
  tip.innerHTML = `<b>${m.name} · ${m.vi}</b><span>${L.sym} ${L.name} — ${fmt(r.eff, 1)} sets / week</span><span>${r.direct} direct · ${r.indirect} indirect sets · ${r.workouts} workouts</span><span>${r.last ? 'Last: ' + fmtDateFull(r.last) : 'Not trained in this period'}</span>`;
  tip.classList.remove('hidden');
}

function muscleChipsHTML(cur) {
  return `<div class="mchips">${MM_MUSCLES.map(m => { const st = cur.p.includes(m.id) ? 'p' : cur.s.includes(m.id) ? 's' : ''; return `<button type="button" class="mchip ${st}" data-action="mchip" data-m="${m.id}" data-state="${st}">${m.name}<small>${st === 'p' ? 'Primary' : st === 's' ? '½' : ''}</small></button>`; }).join('')}</div>
    <div class="row mt" style="justify-content:space-between"><span class="muted small">Tap to cycle: off → primary (1 set) → secondary (½ set).</span><button type="button" class="btn btn-sm btn-ghost" data-action="mchip-reset">Reset to auto-detect</button></div>`;
}
function readChips() {
  const p = [], s = [];
  $$('.modal .mchip').forEach(b => { if (b.dataset.state === 'p') p.push(b.dataset.m); else if (b.dataset.state === 's') s.push(b.dataset.m); });
  return { p, s };
}
function setChip(b, st) {
  b.dataset.state = st;
  b.className = 'mchip ' + st;
  b.querySelector('small').textContent = st === 'p' ? 'Primary' : st === 's' ? '½' : '';
}

function renderDaysList() {
  const el = $('#days-list');
  if (!el) return;
  const season = activeSeason(), week = activeWeek(season);
  if (!week) return;
  const q = norm(UI.search), m = UI.muscle, filtering = !!(q || m);
  const html = week.days.map((d, i) => {
    const exs = d.exercises.filter(e => (!q || norm(e.name).includes(q)) && (!m || e.muscleGroup === m));
    if (filtering && !exs.length) return '';
    return dayHTML(d, week, exs, filtering);
  }).join('');
  el.innerHTML = html || (week.days.length
    ? `<div class="card empty-state"><p class="muted">No exercises match your filter.</p></div>`
    : `<div class="card empty-state"><h3>No workout days yet</h3><p class="muted">Add a day (e.g. Push, Pull, Legs), then add exercises to it.</p><button class="btn btn-primary" data-action="add-day" data-id="${week.id}">+ Add Day</button></div>`);
  $$('#days-list textarea.autogrow').forEach(autoGrow);
}

function weekStatsHTML(week) {
  const t = Calc.weekTotals(week);
  const A = Calc.analyze();
  const i = A.weeks.findIndex(x => x.week === week);
  const pv = i > 0 ? Calc.weekTotals(A.weeks[i - 1].week).volume : 0;
  const pct = t.days ? Math.round(t.doneDays / t.days * 100) : 0;
  return `<div class="wk-progress"><div class="bar"><span style="width:${pct}%"></span></div><span class="muted">${t.doneDays}/${t.days} days completed</span></div>
    <div class="wk-nums">${mini('Workouts', t.workouts)}${mini('Sets', t.sets)}${mini('Reps', fmtInt(t.reps))}${mini('Volume', fmtInt(t.volume) + ' kg')}${mini('vs prev week', pv ? deltaChip(Math.round((t.volume - pv) / pv * 100), '%') : '—')}${t.km || t.min ? mini('Cardio', `${fmt(t.km, 1)} km · ${fmtDurLong(t.min)}`) : ''}</div>`;
}

function dayStatsHTML(d) {
  const t = Calc.dayTotals(d);
  const cardio = t.km || t.min ? ` · ❤️ ${t.km ? fmt(t.km, 2) + ' km · ' : ''}${fmtDurLong(t.min)}${t.steps ? ' · ' + fmtInt(t.steps) + ' steps' : ''}` : '';
  return `${d.date ? `<b>${weekday(d.date)}</b> ${fmtDate(d.date)} · ` : ''}${d.exercises.length} exercises · ${t.sets} sets · ${fmtInt(t.reps)} reps · ${fmtInt(t.volume)} kg volume${cardio}`;
}

function dayHTML(d, week, exs, filtering) {
  return `<section class="card day ${UI.collapsed.has(d.id) ? 'collapsed' : ''} ${d.completed ? 'is-done' : ''}" data-day="${d.id}">
    <header class="day-head">
      <button class="icon-btn" data-action="toggle-day" data-id="${d.id}" aria-label="Collapse or expand">${icon('chev', 'chev')}</button>
      <input class="day-name" ${bind(d, 'name')} value="${esc(d.name)}" placeholder="Day name" aria-label="Day name">
      <label class="done-toggle"><input type="checkbox" ${bind(d, 'completed')} ${d.completed ? 'checked' : ''}><span>${d.completed ? 'Completed' : 'Mark done'}</span></label>
      <div class="day-actions">
        <button class="icon-btn" data-action="move" data-dir="-1" data-id="${d.id}" title="Move day up" aria-label="Move day up">${icon('up')}</button>

        <button class="icon-btn danger" data-action="delete-day" data-id="${d.id}" title="Delete day" aria-label="Delete day">${icon('trash')}</button>
      </div>
      <div class="day-meta">
        <input type="date" class="input sm" ${bind(d, 'date')} value="${esc(d.date)}" aria-label="Date">

      </div>
    </header>
    <div class="day-stats" data-day-stats="${d.id}">${dayStatsHTML(d)}</div>
    <div class="day-body" data-day-body="${d.id}">
      ${exs.map((e, j) => exHTML(e, j, d, week)).join('')}

}

function exHTML(e, j, d, week) {
  if (isCardio(e)) return cardioExHTML(e, j, d, week);
  const A = Calc.analyze();

    <div class="ex-head">
      <span class="drag" data-drag title="Drag to reorder">${icon('grip')}</span>

      <div class="ex-actions">
        <button class="icon-btn" data-action="move" data-dir="-1" data-id="${e.id}" title="Move up" aria-label="Move exercise up">${icon('up')}</button>

    <div class="ex-imgs" data-ex-imgs="${e.id}">${exImgsHTML(e)}</div>
  </article>`;
}

async function addExImages(exId, files) {
  const c = ctxOf(exId);
  files = [...files].filter(f => f && /^image\//.test(f.type));

  let added = 0;
  for (const f of files) {

      added++;
    } catch (err) { toast(err && err.name === 'QuotaExceededError' ? 'Storage full — image not saved.' : `Could not save ${f.name || 'image'}`, 'error'); break; }
  }
  refreshExImgs(exId);
  if (added) toast(`${added} image${added > 1 ? 's' : ''} added to ${c.obj.name}${ExImg.mode === 'mem' ? ' (this browser cannot store images — they disappear on reload)' : ''}`);
}

function cardioPrevHTML(e, week) {
  const rows = Calc.cardioHistory(e.name);
  const wi = Calc.analyze().weeks.findIndex(x => x.week === week);
  const cur = rows.find(r => r.idx === wi), prev = [...rows].reverse().find(r => r.idx < wi);
  const unit = cardioType(e.name).unit;
  const parts = [prev ? `<span>Last (${esc(prev.label)}): ${cardioStr(prev, unit)}</span>` : '<span>First time logging this activity</span>'];
  if (prev && cur && prev.km && cur.km) parts.push(deltaChip(+(cur.km - prev.km).toFixed(2), ' km'));
  const longest = Math.max(0, ...rows.map(r => r.longest));
  if (longest) parts.push(`<span class="pr-mini">Longest ${fmt(longest, 2)} km</span>`);
  return parts.join('');
}

function exTargetsHTML(e) {
  const t = musclesFor(e);
  const parts = [...t.p.map(id => MM_BY[id].name), ...t.s.filter(id => !t.p.includes(id)).map(id => `${MM_BY[id].name} ½`)];
  return `<span class="ex-targets">${parts.length ? 'Targets: ' + parts.join(' · ') : 'No target muscles — edit to set them'}</span>`;
}

function setRowHTML(s, k, A) {
  return `<tr class="${s.done ? 'done' : ''}">

function exPrevHTML(e, week) {
  if (isCardio(e)) return cardioPrevHTML(e, week);
  const { cur, prev, pr } = Calc.exCompare(e, week);
  const parts = [];
  parts.push(prev ? `<span>Last (${esc(prev.label)}): <b>${setStr(prev.best)}</b></span>` : '<span>First time logging this exercise</span>');
  if (prev && cur && cur.best && prev.best) {
    const dw = cur.best.weight - prev.best.weight;
    parts.push(dw ? deltaChip(dw, ' kg') : deltaChip(cur.best.reps - prev.best.reps, ' reps'));
    if (prev.volume) parts.push(`<span>Vol ${deltaChip(Math.round((cur.volume - prev.volume) / prev.volume * 100), '%')}</span>`);
  }
  if (pr) parts.push(`<span class="pr-mini">PR ${setStr(pr)}</span>`);
  return parts.join('');
}

function exStatsHTML(e) {
  if (isCardio(e)) { const c = Calc.cardioTotals(e); return c.segs ? cardioStr(c, cardioType(e.name).unit) : 'Nothing logged yet — enter km, time or steps'; }

/* ============================================================
   VIEW: PROGRESS
   ============================================================ */
function renderProgress() {
  const A = Calc.analyze();
  const sid = UI.progressSeason === 'all' || S.seasons.some(s => s.id === UI.progressSeason) ? UI.progressSeason : (UI.progressSeason = 'all');
  const recs = Object.values(A.ex).filter(r => r.rows.length).sort((a, b) => a.name.localeCompare(b.name));
  if (!UI.progressEx || !A.ex[UI.progressEx] || !A.ex[UI.progressEx].rows.length) UI.progressEx = (recs.find(r => r.key === 'bench press') || recs[0] || {}).key || '';
  const rec = A.ex[UI.progressEx];
  const rows = rec ? rec.rows.filter(r => sid === 'all' || r.season.id === sid) : [];
  const first = rows[0], last = rows[rows.length - 1];
  const pr = rec ? A.prInfo[rec.key] : null;
  const gain = first && last && first.best && last.best ? last.best.weight - first.best.weight : 0;
  const gainPct = first && first.best && first.best.weight ? gain / first.best.weight * 100 : 0;
  const events = A.prEvents.filter(e => sid === 'all' || e.season.id === sid).slice(-12).reverse();

  view().innerHTML = `

function resizeImage(file, max = 800, q = 0.7) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Unreadable image')); };
    img.src = url;
  });
}

function closestWeight(date) {
  let best = null;
  S.body.forEach(b => { if (!best || Math.abs(diffDays(b.date, date)) < Math.abs(diffDays(best.date, date))) best = b; });
  return best && Math.abs(diffDays(best.date, date)) <= 7 ? best : null;
}

function md(src) {
  const inline = t => {
    let s = esc(t);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
    return s;
  };
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let html = '', list = null, code = false, para = [];
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    if (code) { if (/^```/.test(raw)) { html += '</code></pre>'; code = false; } else html += esc(raw) + '\n'; continue; }
    if (/^```/.test(raw)) { flushP(); closeList(); html += '<pre><code>'; code = true; continue; }
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushP(); closeList(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) { flushP(); closeList(); const l = m[1].length + 1; html += `<h${l}>${inline(m[2])}</h${l}>`; continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushP(); closeList(); html += '<hr>'; continue; }
    if ((m = line.match(/^>\s?(.*)/))) { flushP(); closeList(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)/))) { flushP(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    closeList(); para.push(line.trim());
  }
  flushP(); closeList();
  if (code) html += '</code></pre>';
  return html;
}

        if (UI.mmTouched) { const chosen = readChips(); data.muscles = sameMuscles(chosen, autoMuscles(name, data.muscleGroup)) ? null : chosen; }
        else if (item) data.muscles = item.muscles || null;
        if (!item && S.library.some(x => norm(x.name) === norm(name))) { toast('An exercise with this name already exists', 'error'); return false; }
        if (item) Object.assign(item, data); else S.library.push({ id: uid(), ...data });
        Store.save(); renderLibrary(); toast('Library saved');
      } },
    ],
  });
}

const VIEWS = { dashboard: renderDashboard, training: renderTraining, progress: renderProgress, body: renderBody, knowledge: renderKnowledge, settings: renderSettings };

function render() {
  Charts.destroyAll();

  VIEWS[UI.view]();
}
function route() {
  const v = location.hash.replace(/^#\/?/, '');
  UI.view = VIEWS[v] ? v : 'dashboard';
  $$('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === UI.view));

}
function applyTheme() {
  const t = S.settings.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  $('#theme-btn').innerHTML = t === 'light' ? `${icon('moon')} Dark mode` : `${icon('sun')} Light mode`;

}
function buildShell() {
  const brand = `${LOGO}<div class="brand-name">The Adrian<br><span>Pump</span></div>`;
  $('#brand-desktop').innerHTML = brand;
  $('#brand-mobile').innerHTML = `${LOGO}<div class="brand-name">The Adrian <span>Pump</span></div>`;

}

  'note-cat': v => { UI.noteCat = v; $('#note-items').innerHTML = noteItemsHTML(); },
  'lib-muscle': v => { UI.libMuscle = v; $('#lib-grid').innerHTML = libGridHTML(); },
  'ex-img-file': async (v, el) => { const files = [...el.files]; el.value = ''; await addExImages(el.dataset.ex, files); },
  'photo-file': async (v, el) => {
    const files = [...el.files];
    const date = ($('#photo-date') || {}).value || todayISO();
    let added = 0;
    for (const f of files) {
      try {
        const dataUrl = await resizeImage(f);
        const p = { id: uid(), date, dataUrl, note: '' };
        PHOTOS.push(p);
        if (!Store.savePhotos()) { PHOTOS.pop(); break; }
        added++;
      } catch (e) { toast(`Could not read ${f.name}`, 'error'); }
    }
    el.value = '';
    renderPhotos();
    if (added) toast(`${added} photo${added > 1 ? 's' : ''} added`);
  },
  'import-file': (v, el) => {
    const f = el.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = async () => {
      el.value = '';
      let parsed, data;
      try {
        parsed = JSON.parse(reader.result);
        data = migrate(JSON.parse(JSON.stringify(parsed.data || parsed)));
        if (!Array.isArray((parsed.data || parsed).seasons)) throw new Error('Missing seasons');
      } catch (e) { toast('This file is not a valid Adrian Pump backup', 'error'); return; }
      const weeks = data.seasons.reduce((a, s) => a + s.weeks.length, 0);
      if (!await confirmDialog(`Import ${data.seasons.length} seasons, ${weeks} weeks, ${data.body.length} body entries and ${data.notes.length} notes? This <b>replaces</b> all current data.${Sync.note()}`, { title: 'Import backup', ok: 'Import & replace', danger: false })) return;
      S = data;
      if (Array.isArray(parsed.photos)) PHOTOS = parsed.photos;
      let imgFail = 0;
      if (Array.isArray(parsed.exImages)) {
        try { await ExImg.clear(); } catch (e) {}
        for (const x of parsed.exImages) { if (!x || !x.id || !x.exId || !/^data:image\//.test(String(x.dataUrl))) continue; try { await ExImg.put(x); } catch (e) { imgFail++; } }
      }
      Store.save(); Store.saveNow(); Store.savePhotos(); applyTheme(); render(); toast(imgFail ? `Backup imported — ${imgFail} exercise images could not be stored` : 'Backup imported');
    };
    reader.readAsText(f);
  },
};

/* ---------- two-way binding for inline-edited fields ---------- */
function onBind(el) {
  const c = ctxOf(el.dataset.id);
  if (!c) return;
  const f = el.dataset.field;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if ('dur' in el.dataset) { v = parseDur(el.value); el.classList.toggle('invalid', el.value.trim() !== '' && v === null); }
  else if ('num' in el.dataset) { const s = el.value.replace(',', '.').trim(); v = s === '' ? null : parseFloat(s); if (Number.isNaN(v)) v = null; }
  else v = el.value;
  c.obj[f] = v;
  if (c.type === 'set' && ['reps', 'weight', 'distance', 'duration', 'steps'].includes(f) && v !== null && !c.obj.done) {
    c.obj.done = true;
    const cb = el.closest('tr') && el.closest('tr').querySelector('[data-field="done"]');
    if (cb) cb.checked = true;
  }
  if (c.type === 'photo') Store.savePhotos(); else Store.save();
  if (c.type === 'set') refreshEx(c);
  if (c.type === 'day' && f === 'date') { const ds = $(`[data-day-stats="${c.obj.id}"]`); if (ds) ds.innerHTML = dayStatsHTML(c.obj); }
  if (el.classList.contains('autogrow')) autoGrow(el);
}
function afterChange(el) {
  const c = ctxOf(el.dataset.id);
  if (!c) return;
  const f = el.dataset.field;
  if (c.type === 'day' && f === 'completed') {
    if (c.obj.completed) {
      let n = 0;
      c.obj.exercises.forEach(e => e.sets.forEach(s => { if ((num(s.reps) > 0 || num(s.distance) > 0 || num(s.duration) > 0 || num(s.steps) > 0) && !s.done) { s.done = true; n++; } }));
      toast(n ? `Workout completed 💪 — ${n} set${n > 1 ? 's' : ''} ticked` : 'Workout completed 💪');
      if (n) checkAllPR(c.obj);
    }
    Store.save(); refreshTraining();
  } else if (c.type === 'week' && (f === 'startDate' || f === 'endDate')) {
    if (f === 'startDate' && c.obj.startDate && (!c.obj.endDate || c.obj.endDate < c.obj.startDate)) c.obj.endDate = addDays(c.obj.startDate, 6);
    Store.save(); renderTraining();
  } else if (c.type === 'set' && (f === 'reps' || f === 'weight' || f === 'done')) {
    checkPR(c);
  } else if (c.type === 'settings') {
    render();
  }
}
function checkAllPR(day) {
  day.exercises.forEach(e => e.sets.forEach(s => checkPR({ obj: s })));
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const ma = e.target.closest('[data-modal-act]');
  if (ma) {
    const a = Modal.actions[+ma.dataset.modalAct];
    const tok = Modal.token;
    const r = a && a.onClick ? a.onClick() : undefined;
    if (r !== false && Modal.token === tok) Modal.close();
    return;
  }
  if (e.target.classList.contains('modal-backdrop')) { Modal.close(); return; }
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const fn = Actions[t.dataset.action];
  if (!fn) return;
  if (t.tagName !== 'INPUT') e.preventDefault();
  fn(t, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-bind]')) { onBind(el); return; }
  const k = el.dataset && el.dataset.input;
  if (k && Inputs[k]) Inputs[k](el.value, el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-bind]')) { afterChange(el); return; }
  const k = el.dataset && el.dataset.change;
  if (k && Changes[k]) Changes[k](el.value, el);
});
document.addEventListener('mouseover', e => {
  if (e.target.closest && e.target.closest('#mm3d')) return; // the 3D viewer manages its own hover
  const g = e.target.closest && e.target.closest('.mm-g');
  mmHover(g ? g.dataset.m : null);
});
document.addEventListener('mousemove', e => {
  const tip = $('#mm-tip'), card = $('#mm-card');
  if (!tip || !card || tip.classList.contains('hidden')) return;
  const r = card.getBoundingClientRect();
  let x = e.clientX - r.left + 14;
  const y = e.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 8) x = e.clientX - r.left - tip.offsetWidth - 14;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Modal.isOpen()) { Modal.close(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.mm-g')) { e.preventDefault(); mmSelect(e.target.dataset.m); return; }
  if (e.key === 'Enter' && Modal.isOpen() && e.target.matches('.modal input:not([type=checkbox]):not([type=radio])') && Modal.actions.length) {
    e.preventDefault();
    const btns = $$('.modal-foot [data-modal-act]');
    btns[btns.length - 1].click();
  }
});

/* images: paste (Ctrl+V) into the focused or hovered exercise, or drop image files onto an exercise card */
let hoverEx = null;
document.addEventListener('mouseover', e => { const ex = e.target.closest && e.target.closest('.ex'); hoverEx = ex ? ex.dataset.ex : null; });
document.addEventListener('paste', e => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => /^image\//.test(f.type));
  if (!files.length || Modal.isOpen()) return;
  const card = (document.activeElement && document.activeElement.closest && document.activeElement.closest('.ex')) || (hoverEx && $(`.ex[data-ex="${hoverEx}"]`));
  if (!card) return;
  e.preventDefault();
  addExImages(card.dataset.ex, files);
});
const hasFiles = e => !!(e.dataTransfer && [...e.dataTransfer.types].includes('Files'));
document.addEventListener('dragover', e => {
  if (dragId || !hasFiles(e)) return;
  const card = e.target.closest && e.target.closest('.ex');
  $$('.ex.img-drop').forEach(x => { if (x !== card) x.classList.remove('img-drop'); });
  e.preventDefault(); // never let a dropped file navigate away from the app
  e.dataTransfer.dropEffect = card ? 'copy' : 'none';
  if (card) card.classList.add('img-drop');
});
document.addEventListener('dragleave', e => { if (!dragId && e.target.classList && e.target.classList.contains('ex') && !e.target.contains(e.relatedTarget)) e.target.classList.remove('img-drop'); });
document.addEventListener('drop', e => {
  if (dragId || !hasFiles(e)) return;
  $$('.ex.img-drop').forEach(x => x.classList.remove('img-drop'));
  e.preventDefault();
  const card = e.target.closest && e.target.closest('.ex');
  if (card) addExImages(card.dataset.ex, e.dataTransfer.files);
});

/* drag & drop to reorder exercises (also across days of the same week) */
let dragId = null;
document.addEventListener('mousedown', e => {
  const h = e.target.closest('[data-drag]');
  if (h) h.closest('.ex').draggable = true;
});
document.addEventListener('mouseup', () => { $$('.ex[draggable="true"]').forEach(x => { if (!dragId) x.draggable = false; }); });
document.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.ex[draggable="true"]');
  if (!card) return;
  dragId = card.dataset.ex;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
});
document.addEventListener('dragover', e => {
  if (!dragId) return;
  const over = e.target.closest('.ex');
  const zone = e.target.closest('.day-body');
  if (!over && !zone) return;
  e.preventDefault();
  $$('.drop-before, .drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  if (over && over.dataset.ex !== dragId) {
    const r = over.getBoundingClientRect();
    over.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
  }
});
document.addEventListener('drop', e => {
  if (!dragId) return;
  e.preventDefault();
  const src = ctxOf(dragId);
  const over = e.target.closest('.ex');
  const zone = e.target.closest('.day-body');
  if (src && (over || zone) && (!over || over.dataset.ex !== dragId)) {
    const targetDay = ctxOf(over ? over.dataset.dayId : zone.dataset.dayBody);
    if (targetDay) {
      removeCtx(src);
      const list = targetDay.obj.exercises;
      let idx = list.length;
      if (over) {
        const oi = list.findIndex(x => x.id === over.dataset.ex);
        const r = over.getBoundingClientRect();
        idx = e.clientY < r.top + r.height / 2 ? oi : oi + 1;
      }
      list.splice(idx, 0, src.obj);
      Store.save();
    }
  }
  dragId = null;
  refreshTraining();
});
document.addEventListener('dragend', () => {
  $$('.ex').forEach(x => { x.draggable = false; x.classList.remove('dragging', 'drop-before', 'drop-after'); });
  dragId = null;
});

window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
window.addEventListener('beforeunload', () => Store.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flush(); });
let resizeT;
let lastW = window.innerWidth;
// Only re-render on width changes (mobile URL bars change the height while scrolling).
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (UI.view === 'dashboard' && window.innerWidth !== lastW) { lastW = window.innerWidth; render(); } }, 300); });

/* One-time data patches: each runs once per browser, then is recorded in localStorage. */
const PATCHES = /*PATCHES-BEGIN*/[]/*PATCHES-END*/;
function applyPatches() {
  const PK = 'adrianPump.patches';
  let done = [];
  try { done = JSON.parse(localStorage.getItem(PK) || '[]'); } catch (e) {}
  for (const p of PATCHES) {
    if (done.includes(p.id)) continue;
    const season = S.seasons.find(s => s.id === S.settings.activeSeasonId) || S.seasons[0];
    const weeks = season ? [...season.weeks].sort(byNum).reverse() : [];
    const active = weeks.find(w => w.id === S.settings.activeWeekId);
    let day = null;
    for (const w of active ? [active, ...weeks] : weeks) { day = w.days.find(d => new RegExp(p.day, 'i').test(d.name)); if (day) break; }
    if (!day) { toast('Patch ' + p.id + ': no matching day found, nothing changed.', 'error'); continue; }
    const x = p.exercise, lib = S.library.find(l => norm(l.name) === norm(x.name));
    const sets = Array.isArray(x.cardio)
      ? x.cardio.map(c => ({ id: uid(), reps: null, weight: null, distance: c.distance ?? null, duration: c.duration ?? null, steps: c.steps ?? null, notes: c.notes || '', done: true }))
      : x.sets.map(([reps, weight]) => ({ id: uid(), reps, weight, notes: '', done: true }));
    const ex = day.exercises.find(e => norm(e.name) === norm(x.name));
    if (ex) { ex.sets = sets; ex.notes = x.notes; }
    else day.exercises.push({ id: uid(), libraryId: lib ? lib.id : null, name: x.name, muscleGroup: x.muscleGroup, instructions: x.instructions, perSide: x.perSide, notes: x.notes, sets });
    Store.save(); Store.saveNow(); render();
    done.push(p.id);
    try { localStorage.setItem(PK, JSON.stringify(done)); } catch (e) {}
    toast(`Updated "${day.name}": ${x.name}`);
  }
}

/* ============================================================
   INIT
   ============================================================ */
if (typeof Chart !== 'undefined') {
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
  Chart.defaults.font.size = 12;
}
Store.load();
buildShell();
applyTheme();
route();
applyPatches();
// Cloud sync starts once exercise images are loaded, so it never mistakes them for deleted.
ExImg.load().then(() => { if (ExImg.list.length && (UI.view === 'training' || UI.view === 'settings')) render(); Sync.start(); });
window.addEventListener('online', () => { if (Sync.user && Sync.merged) { Sync.setState(Sync.pending ? 'saving' : 'synced'); Sync.push(); } });
window.addEventListener('offline', () => { if (Sync.user) Sync.setState('offline'); });
setInterval(() => { if (Sync.pendingRender) Sync.rerender(); }, 1000);
</script>
